<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050b14">
<link rel="icon" id="fav" type="image/png">
<title>BASINGAME · BASINGAME</title>
<style>
:root{--bg:#050b14;--bg2:#0a1424;--card:rgba(13,22,38,.78);--line:rgba(255,255,255,.09);--txt:#eaf0f8;--mut:#8b99ae;--gold:#c8a74d;--gold2:#e4c872;--err:#f0625a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);display:grid;place-items:center;min-height:100vh;padding:20px;overflow:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(900px 520px at 85% -10%,rgba(76,141,246,.16),transparent 60%),
 radial-gradient(800px 520px at 8% 110%,rgba(200,167,77,.14),transparent 60%),
 linear-gradient(180deg,#050b14,#070f1c)}
.grid{position:fixed;inset:0;z-index:0;opacity:.5;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at center,#000 30%,transparent 75%)}
/* El logo real de BASINGAME, no una pelota generica. Es un wordmark ancho,
   asi que va con height auto y sin girar: una marca rotando se lee mal. */
.ball{position:fixed;right:-50px;bottom:-30px;width:440px;height:auto;z-index:0;opacity:.06}
.lgo{height:40px;width:auto;display:block;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.lang{position:fixed;top:18px;right:18px;z-index:3;display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(10,18,32,.7);backdrop-filter:blur(10px)}
.lang button{all:unset;cursor:pointer;font:600 11px/1 inherit;letter-spacing:.1em;padding:8px 12px;border-radius:999px;color:var(--mut);transition:.2s}
.lang button:hover{color:var(--txt)}
.lang button[aria-pressed=true]{background:var(--gold);color:#10131a}
.card{position:relative;z-index:2;width:min(440px,100%);padding:38px 34px 30px;border-radius:22px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 40px 90px -30px rgba(0,0,0,.7),0 1px 0 rgba(255,255,255,.05) inset;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.card::before{content:"";position:absolute;inset:-1px;border-radius:23px;padding:1px;background:linear-gradient(140deg,rgba(228,200,114,.55),transparent 35%,transparent 65%,rgba(76,141,246,.35));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.mark{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(228,200,114,.2),rgba(200,167,77,.06));border:1px solid rgba(200,167,77,.4)}
.brand b{display:block;font-size:17px;letter-spacing:.2em;font-weight:700;background:linear-gradient(90deg,#f4ecd2,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;margin-top:3px;font-size:10px;letter-spacing:.22em;color:var(--mut);text-transform:uppercase}
h1{font-size:25px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.sub{margin-top:8px;font-size:14px;line-height:1.55;color:var(--mut)}
.for{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:7px 13px;border-radius:999px;border:1px solid rgba(200,167,77,.3);background:rgba(200,167,77,.08);font-size:12px;color:var(--gold2)}
.for i{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}
form{margin-top:24px}
.field{position:relative}
.field svg.l{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--mut);pointer-events:none}
input{width:100%;height:52px;padding:0 48px 0 46px;border-radius:13px;border:1px solid var(--line);background:rgba(5,11,20,.7);color:var(--txt);font:500 15px inherit;letter-spacing:.02em;outline:none;transition:border-color .2s,box-shadow .2s}
input::placeholder{color:#58667c}
.rec{display:flex;align-items:center;gap:9px;margin:14px 2px 0;color:#8fa0b8;font-size:13.5px;cursor:pointer;user-select:none}
.rec input{width:16px;height:16px;flex:0 0 16px;accent-color:var(--gold);cursor:pointer;height:16px;padding:0}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(200,167,77,.16)}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;border-radius:9px;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center;transition:.2s}
.eye:hover{color:var(--txt);background:rgba(255,255,255,.06)}
.go{margin-top:14px;width:100%;height:52px;border:0;border-radius:13px;cursor:pointer;font:700 14px inherit;letter-spacing:.06em;text-transform:uppercase;color:#10131a;background:linear-gradient(135deg,#e9cd7b,var(--gold));box-shadow:0 14px 34px -12px rgba(200,167,77,.65);transition:transform .2s,filter .2s,box-shadow .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.go:hover{transform:translateY(-2px);filter:brightness(1.06)}
.go:active{transform:none}
.go[disabled]{opacity:.7;cursor:wait;transform:none}
.spin{width:16px;height:16px;border:2px solid rgba(16,19,26,.3);border-top-color:#10131a;border-radius:50%;animation:sp .7s linear infinite;display:none}
.go[disabled] .spin{display:block}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{min-height:20px;margin-top:12px;font-size:13px;text-align:center;color:var(--err);opacity:0;transition:opacity .25s}
.msg.on{opacity:1}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.foot{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;letter-spacing:.08em;color:#66748a}
.exp{display:none;text-align:center}
.exp.on{display:block}
.exp .ic{width:56px;height:56px;margin:0 auto 14px;border-radius:16px;display:grid;place-items:center;background:rgba(240,98,90,.1);border:1px solid rgba(240,98,90,.35);color:var(--err)}
@media(max-width:480px){.card{padding:30px 22px 24px}h1{font-size:22px}.lang{top:12px;right:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
