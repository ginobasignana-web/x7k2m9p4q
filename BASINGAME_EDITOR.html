<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BASINGAME Editor</title>
<link rel="icon" id="fav" type="image/png">
<style>
:root{--bg:#0d0f12;--p1:#14171c;--p2:#1a1e25;--bd:#252a33;--tx:#e6e9ee;--mu:#8b93a1;--ac:#f5a524;--ok:#3ecf8e;--rd:#ef5350;--r:8px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;min-height:0}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--p1);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.08em;font-size:12px}.logo b{color:var(--ac)}
.sp{flex:1}
.bt{background:var(--p2);border:1px solid var(--bd);border-radius:6px;padding:5px 10px}
.bt:hover{border-color:#3a4150}.bt.on{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.bt.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:700}
.bt.dng{color:var(--rd)}
.bt.sm{padding:2px 7px;font-size:12px}
input[type=text],input[type=number],select,textarea{background:#0f1216;border:1px solid var(--bd);border-radius:6px;padding:5px 8px;min-width:0}
input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--bd);background:none;border-radius:6px}
main{display:grid;grid-template-columns:minmax(0,1fr) 6px var(--rw,440px);gap:0;min-height:0}
.left{display:flex;flex-direction:column;min-height:0;min-width:0;overflow-y:auto}
.right{display:flex;flex-direction:column;min-height:0;background:var(--p1)}
#stage{position:relative;background:#000;flex:none;height:var(--sh,42vh);min-height:140px;display:flex;align-items:center;justify-content:center}
#stage video{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;background:#000}
#scv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#shud{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:14px;background:#060b1af0;border:1px solid #2a3a5e;opacity:0;transition:opacity .25s;backdrop-filter:blur(6px)}
#shz{position:absolute;inset:0;z-index:45}
.ptot{margin:14px 12px 4px;padding:12px 16px;border:1px solid var(--bd2);border-radius:12px;background:#0c1630;font-size:15px}.ptot b{color:#a9c2ff;font-size:17px}
body.simhud #shud,#shud:hover{opacity:1}
body.simon:not(.simhud) #shz{cursor:none}
#shud button{background:transparent;border:0;color:#e8edf8;font-size:15px;padding:6px 10px;border-radius:9px;cursor:pointer}#shud{flex-direction:column;align-items:stretch;gap:6px;width:min(760px,94vw)}
.shr{display:flex;align-items:center;gap:12px;padding:0 6px}.shr #simSeek{flex:1}.shb{display:flex;align-items:center;gap:4px;justify-content:center;flex-wrap:wrap}
#shud button:hover{background:#19233b}#shud button.on{background:#2f63e8}
#simTime{color:#fff;font-size:12px;font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap}
#simInfo{color:#9fb0d2;font-size:12px;padding:0 10px;white-space:nowrap}
body.simon #stage{position:fixed;inset:0;z-index:200;background:#000}
body.simon header,body.simon #ctl{visibility:hidden}
#ctl #liveBtn{color:#ff8a87;border-color:#6b2a30;font-variant-numeric:tabular-nums;white-space:nowrap}#ctl #liveBtn.on{background:#d83a3a;border-color:#ef5350;color:#fff}

#home{position:fixed;inset:0;z-index:20;grid-template-columns:300px 1fr;background:radial-gradient(1000px 520px at 85% -12%,#12285a 0%,transparent 62%),radial-gradient(700px 420px at 0% 110%,#0d1d44 0%,transparent 60%),#060a12;overflow:auto}
.hms{background:linear-gradient(180deg,#0b1222,#070c18);border-right:1px solid #16213a;padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px;min-height:100%;animation:hmIn .6s both}
.hmtop{display:flex;align-items:center;justify-content:space-between}
.hmlogo{height:44px;width:auto;max-width:200px;object-fit:contain;filter:drop-shadow(0 4px 14px #0009)}
.hmk{background:transparent;border:1px solid transparent;color:var(--mu);font-size:18px;cursor:pointer;padding:2px 9px;border-radius:9px;transition:.2s}.hmk:hover{background:#ffffff0d;border-color:#ffffff14;color:#fff}
.hmown{display:flex;flex-direction:column;gap:3px;padding:16px;border:1px solid #1b2846;border-radius:16px;background:linear-gradient(180deg,#0f1930cc,#0a1224cc);position:relative;overflow:hidden}
.hmown::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,#4d84ff88,transparent)}
.hmid{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.hmav{flex:none;width:46px;height:46px;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,#4d84ff,#8ab0ff,#2f63e8,#4d84ff);animation:hmSpin 9s linear infinite;position:relative}
.hmav i{display:block;width:100%;height:100%;border-radius:50%;background:#070c18 center/74% no-repeat;animation:hmSpin 9s linear infinite reverse}
.hmn{font:700 18px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.04em;color:#fff}
.hmr{color:#b9c6e2;font-size:12px;line-height:1.3}.hmc{color:#7f8fb0;font-size:11px;margin-top:1px}
.hmct{display:flex;gap:7px;margin-top:12px}
.hmic{width:34px;height:34px;border-radius:10px;border:1px solid #1f2d4d;background:#0b1428;display:grid;place-items:center;color:#9fb6ec;transition:.2s;text-decoration:none}
.hmic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hmic:hover{background:#4d84ff;border-color:#4d84ff;color:#fff;transform:translateY(-2px);box-shadow:0 8px 18px -8px #4d84ff}
.hmweb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:10px 14px;border-radius:12px;text-decoration:none;color:#dbe6ff;font:600 13px Inter,sans-serif;letter-spacing:.01em;background:linear-gradient(#0c1530,#0c1530) padding-box,linear-gradient(120deg,#4d84ff,#2a3f75 45%,#8ab0ff) border-box;border:1px solid transparent;transition:.25s}
.hmweb svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.hmweb:hover{color:#fff;box-shadow:0 10px 26px -12px #4d84ff;transform:translateY(-1px)}.hmweb:hover svg{transform:translate(3px,-3px)}
.hmln{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.hmln button{display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;border-radius:10px;color:#a8b6d4;font:500 13px Inter,sans-serif;padding:11px 12px;cursor:pointer;text-align:left;transition:.2s}.hmln button:hover{color:#fff;background:#ffffff0a}.hmln i{font-style:normal;color:#5d6c8c;font-size:18px}
.hmm{padding:0 44px 28px;display:flex;flex-direction:column;min-width:0}
.hmhero{position:relative;display:grid;grid-template-columns:1fr minmax(260px,420px);gap:20px;align-items:center;padding:34px 0 8px;min-height:230px}
.hmeb{font:600 11px Inter,sans-serif;letter-spacing:.34em;color:#6f93ee;text-transform:uppercase;display:flex;align-items:center;gap:10px;animation:hmUp .6s .05s both}
.hmeb::before{content:"";width:26px;height:1px;background:#4d84ff}
.hmm h1{margin:10px 0 0;font:700 clamp(30px,3.6vw,46px)/1.04 "Barlow Condensed",sans-serif;letter-spacing:.02em;text-transform:uppercase;animation:hmUp .6s .12s both}
.hmm h1 em{font-style:normal;background:linear-gradient(100deg,#8ab0ff,#4d84ff 60%,#7fa6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hmsub{color:#8f9dba;font-size:13.5px;max-width:46ch;margin-top:12px;line-height:1.55;animation:hmUp .6s .2s both}
.hmart{width:100%;height:auto;overflow:visible;animation:hmUp .8s .2s both}
.hmg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}
.hmt{--mx:50%;--my:0%;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:150px;padding:20px;border:1px solid #1b2846;border-radius:18px;background:linear-gradient(180deg,#0e1830,#0a1224);color:var(--tx);cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;animation:hmUp .55s backwards;animation-delay:calc(var(--n)*70ms + 250ms)}
.hmt::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--mx) var(--my),#4d84ff26,transparent 60%);opacity:0;transition:opacity .3s}
.hmt:hover{transform:translateY(-4px);border-color:#34559f;box-shadow:0 26px 50px -26px #000,0 0 0 1px #4d84ff22}.hmt:hover::before{opacity:1}
.hmt:active{transform:translateY(-1px)}
.hmi{position:relative;width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#1a2c5a,#0e1a38);border:1px solid #2a3f75;display:grid;place-items:center;color:#a9c2ff;margin-bottom:10px;transition:.3s}
.hmt:hover .hmi{background:linear-gradient(145deg,#4d84ff,#2f63e8);color:#fff;border-color:#6b9bff;box-shadow:0 10px 22px -8px #4d84ff}
.hmi svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.hmt b{font:600 15px Inter,sans-serif;letter-spacing:.005em;color:#f1f5ff;position:relative}
.hmt span:not(.hmi){color:#8190ad;font-size:12.5px;line-height:1.4;position:relative}
.hmgo{position:absolute;right:16px;top:18px;width:18px;height:18px;fill:none;stroke:#4a5c86;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:.25s}
.hmt:hover .hmgo{stroke:#9fbcff;transform:translate(3px,-3px)}
.hmt.live .hmi{color:#ff9a97;background:linear-gradient(145deg,#3a1a22,#1d0e14);border-color:#6b2a30}
.hmt.live:hover{border-color:#a33a3f}.hmt.live:hover .hmi{background:linear-gradient(145deg,#ef4a47,#c42b2b);color:#fff;border-color:#ff7b78;box-shadow:0 10px 22px -8px #ef4a47}
.hmt.live .hmi::after{content:"";position:absolute;right:-3px;top:-3px;width:9px;height:9px;border-radius:50%;background:#ff4d4a;box-shadow:0 0 0 0 #ff4d4a99;animation:hmPulse 1.8s infinite}
.hmf{margin-top:auto;padding-top:26px;color:#4f5f82;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase}
@keyframes hmUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes hmIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes hmSpin{to{transform:rotate(360deg)}}
@keyframes hmPulse{0%{box-shadow:0 0 0 0 #ff4d4a99}70%,100%{box-shadow:0 0 0 9px #ff4d4a00}}
@keyframes hmBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-46px)}}
@keyframes hmShadow{0%,100%{transform:scale(1);opacity:.45}50%{transform:scale(.55);opacity:.18}}
@keyframes hmHead{0%{transform:translateX(0)}100%{transform:translateX(250px)}}
@keyframes hmFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hmClip{0%,100%{opacity:.55}50%{opacity:1}}
.hmart .bl{animation:hmBounce 1.5s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box}
.hmart .sh{animation:hmShadow 1.5s cubic-bezier(.45,0,.55,1) infinite;transform-box:fill-box;transform-origin:center}
.hmart .ph{animation:hmHead 7s linear infinite}
.hmart .c1,.hmart .c2,.hmart .c3,.hmart .c4{animation:hmClip 3.5s ease-in-out infinite}.hmart .c2{animation-delay:.7s}.hmart .c3{animation-delay:1.4s}.hmart .c4{animation-delay:2.1s}
.hmart .fl{animation:hmFloat 4s ease-in-out infinite}.hmart .fl2{animation-delay:1.3s}.hmart .fl3{animation-delay:2.4s}
@media(prefers-reduced-motion:reduce){#home *{animation:none!important}}
@media(max-width:1100px){.hmg{grid-template-columns:repeat(2,minmax(0,1fr))}.hmhero{grid-template-columns:1fr}.hmart{display:none}}
@media(max-width:820px){#home{grid-template-columns:1fr}.hms{min-height:0}.hmm{padding:0 18px 24px}.hmg{grid-template-columns:1fr}}

#ytbox{position:absolute;inset:0}#ytbox iframe{width:100%;height:100%}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--mu);text-align:center;padding:20px}
#empty.drag{background:#1b1f27}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#000c;border:1px solid var(--bd);padding:6px 12px;border-radius:20px;opacity:0;transition:.2s;pointer-events:none;z-index:5}
#toast.show{opacity:1}
#ctl{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--p1);border-top:1px solid var(--bd);flex-wrap:wrap}
#seek{flex:1 1 200px;accent-color:var(--ac)}
.tm{font-variant-numeric:tabular-nums;color:var(--mu);min-width:96px;text-align:center}
#tl{position:relative;background:var(--p1);border-top:1px solid var(--bd);padding:6px 10px 6px 130px;min-height:54px;max-height:170px;overflow-y:auto}
.lane{position:relative;height:18px;margin:2px 0;background:#10131780;border-radius:3px}
.lane i{position:absolute;left:-122px;width:118px;top:0;font-style:normal;font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;line-height:18px}
.seg{position:absolute;top:1px;bottom:1px;border-radius:3px;min-width:3px;opacity:.9;cursor:pointer;outline:1px solid #0006}
.seg.sel{outline:2px solid #fff;z-index:2}
#ph{position:absolute;top:0;bottom:0;width:2px;background:var(--ac);pointer-events:none;z-index:3;left:130px}
#pbp{flex:1 1 38%;min-height:140px;overflow:auto;background:var(--bg);border-top:1px solid var(--bd)}
.pbh{display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--p1);position:sticky;top:0;z-index:4;border-bottom:1px solid var(--bd);flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{font-weight:600;text-align:left;color:var(--mu);font-size:11px;padding:4px 8px;position:sticky;top:41px;background:var(--bg);z-index:3}
td{padding:4px 8px;border-top:1px solid #1b1f26;vertical-align:middle}
tr.row{cursor:pointer}tr.row:hover td{background:#161a20}
tr.row.sel td{background:#1d2430}tr.row.now td{box-shadow:inset 3px 0 var(--ac)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chip{display:inline-block;background:#262c37;border-radius:10px;padding:1px 7px;margin:1px 2px 1px 0;font-size:11px}
.chip.btn{cursor:pointer;border:1px solid transparent}.chip.btn.on{background:var(--ac);color:#111}
tr.ed td{background:#10151c}
.edg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;align-items:end}
.edg label{display:flex;flex-direction:column;gap:2px;color:var(--mu);font-size:11px}
.tabs{display:flex;gap:4px;padding:8px 10px 0;flex-wrap:wrap;align-items:center}
.tab{background:var(--p2);border:1px solid var(--bd);border-bottom:none;border-radius:6px 6px 0 0;padding:5px 10px}
.tab.on{background:var(--ac);color:#111;font-weight:700;border-color:var(--ac)}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;overflow:auto;align-content:start;flex:1 1 auto}
.kb{position:relative;min-height:54px;border:none;border-radius:var(--r);font-weight:700;font-size:12px;letter-spacing:.02em;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;line-height:1.15;transition:transform .06s,filter .1s}
.kb:hover{filter:brightness(1.12)}.kb:active{transform:scale(.96)}
.kb small{font-weight:500;font-size:10px;opacity:.75}
.kb .k{position:absolute;right:4px;top:2px;font-size:9px;opacity:.7;background:#0004;border-radius:3px;padding:0 4px}
.kb.w2{grid-column:span 2}.kb.w3{grid-column:span 3}
.kb.desc{border-radius:20px;min-height:36px;font-weight:600}
.kb.act{animation:pul 1s infinite;outline:3px solid #fff}
.kb.sel{outline:2px dashed #fff}
.kb.flash{filter:brightness(1.6)}
@keyframes pul{50%{outline-color:var(--ac)}}
.kb .gear{position:absolute;left:3px;top:2px;font-size:10px;opacity:.9}
#editor{border-top:1px solid var(--bd);padding:10px;background:var(--p2);overflow:auto;max-height:46%}
#editor .edg{grid-template-columns:repeat(2,1fr)}
.sw{display:inline-block;width:20px;height:20px;border-radius:5px;cursor:pointer;margin:0 3px 3px 0;border:1px solid #0008}
.hint{color:var(--mu);font-size:11px;padding:4px 10px 8px}
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:20}
#modal.on{display:flex}
#mbox{background:var(--p1);border:1px solid var(--bd);border-radius:10px;width:min(720px,94vw);max-height:86vh;overflow:auto;padding:14px}
#mbox h3{margin:0 0 10px}
.li{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:var(--mu)}
@media(max-width:1000px){#app{height:auto}}
.pgb{height:8px;background:#0f1216;border-radius:5px;overflow:hidden;margin:8px 0}.pgb i{display:block;height:100%;width:0;background:var(--ac)}
pre.cmd{background:#0a0c0f;border:1px solid var(--bd);border-radius:6px;padding:8px;overflow:auto;user-select:all;white-space:pre-wrap}
.blk{display:flex;gap:6px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.blk select{flex:1;min-width:140px}
.lg{max-height:60px;max-width:140px;border:1px solid var(--bd);border-radius:6px;background:#fff2}
#pad{gap:8px;padding:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.kb{overflow-wrap:normal;word-break:normal;padding:6px 4px;font-size:10.5px;letter-spacing:.01em}
.kb{min-height:50px;border-radius:10px;font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;box-shadow:0 1px 0 #ffffff26 inset,0 2px 6px #0006;border:1px solid #ffffff1f;background-image:linear-gradient(180deg,#ffffff1f,#0000002e)}
.kb.desc{border-radius:999px;min-height:34px;font-size:11px;text-transform:none;letter-spacing:.02em;box-shadow:0 1px 0 #ffffff22 inset}
.kb .k{right:7px;top:auto;bottom:4px;font-size:9px;opacity:.5;background:none;padding:0;font-weight:600}
.kb small{font-size:9.5px;letter-spacing:.06em}
.kb.act{background-image:linear-gradient(180deg,#ffffff33,#0000001a)}
.bhint{grid-column:1/-1;color:var(--mu);font-size:11px;margin-top:-4px}
.cvmodes{display:flex;gap:6px;flex-wrap:wrap}
#btabs{display:flex;gap:4px;padding:6px 10px 0;background:var(--p1);border-top:1px solid var(--bd)}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:6px;color:var(--mu);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.sec:after{content:"";flex:1;height:1px;background:var(--bd)}
.sec .bt{letter-spacing:0;text-transform:none}
tr.mrow.off td{opacity:.4}tr.mrow.off td:nth-child(2){opacity:1}
tr.dropt td{box-shadow:inset 0 2px var(--ac)}
tr.mrow{cursor:grab}
.grip{color:var(--mu);cursor:grab;user-select:none;width:18px}
#trimbar{background:var(--p2);border-top:1px solid var(--bd);padding:8px 10px}
.tbar{position:relative;height:30px;background:#0f1216;border:1px solid var(--bd);border-radius:6px;margin:8px 6px;touch-action:none}
.tbar .rg{position:absolute;top:0;bottom:0;background:#f5a52440;border-top:2px solid var(--ac);border-bottom:2px solid var(--ac)}
.tbar .hd{position:absolute;top:-5px;bottom:-5px;width:12px;margin-left:-6px;background:#fff;border-radius:4px;cursor:ew-resize;box-shadow:0 0 0 2px #0008}
.tbar .ph2{position:absolute;top:0;bottom:0;width:2px;background:#6cf;pointer-events:none}
.tbr{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin:4px 0}
.tbr b{min-width:46px}
.tbr input{width:84px}
.swg{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.bgs{width:76px;height:43px;border-radius:7px;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:0 0 0 1px #0008}
.bgs:hover{border-color:#fff8}
input[type=range]{accent-color:var(--ac);width:100%}
#vsplit{cursor:col-resize;background:var(--bd);transition:background .15s}#vsplit:hover,#vsplit.dr{background:var(--ac)}
#hsplit{height:6px;cursor:row-resize;background:var(--bd);flex:none;transition:background .15s}#hsplit:hover,#hsplit.dr{background:var(--ac)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;height:34px;padding:0 8px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--tx);cursor:pointer}
.ib:hover{background:var(--p2);border-color:var(--bd)}
.ib.pri{background:var(--ac);color:#111}.ib.pri:hover{background:#ffb83d}
.ib.wide span{font-size:12px;font-weight:600}
.sepv{width:1px;height:22px;background:var(--bd);margin:0 4px}
header{padding:6px 12px;gap:4px}
.logo{margin-right:6px}
#foot{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--p1);border-top:1px solid var(--bd)}
#cineBar{display:none}
body.cine #app>header,body.cine #foot,body.cine #vsplit,body.cine #hsplit,body.cine #trimbar,body.cine #tl,body.cine #btabs,body.cine #pbp{display:none!important}
body.cine #app,body.cine main{display:block}
body.cine .left{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;overflow:hidden}
body.cine #stage{flex:1 1 auto;height:auto!important}
body.cine .right{position:fixed;top:0;right:0;bottom:0;width:var(--rw,440px);z-index:41;transform:translateX(102%);transition:transform .2s;box-shadow:-8px 0 30px #000a}
body.cine.showpad .right{transform:none}
body.cine #cineBar{display:flex;gap:6px;position:fixed;top:10px;left:10px;z-index:50;opacity:.35;transition:opacity .2s}
body.cine #cineBar:hover{opacity:1}
.kb .x{display:none;position:absolute;right:3px;top:2px;width:16px;height:16px;border-radius:50%;background:#000a;color:#fff;font-size:10px;line-height:16px;text-align:center;z-index:2}
.kb .x:hover{background:var(--rd)}
#pad.edit .kb .x{display:block}
#lib,#pres{min-height:100vh;background:var(--bg)}
.lbw{max-width:1100px;margin:0 auto;padding:18px 20px 50px}
.lbh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.lbw h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:22px 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--p1);border:1px solid var(--bd);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card b{font-size:14px}
.card .row2{display:flex;gap:6px;margin-top:6px}
#pres{flex-direction:column;height:100vh}
.ph{display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--p1);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.pb{flex:1;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);min-height:0}
.pcol{overflow:auto;border-right:1px solid var(--bd);min-height:0}
.pcol .pbh{top:0}
.pf{padding:8px 14px;background:var(--p1);border-top:1px solid var(--bd)}
details.pj{border-bottom:1px solid var(--bd);padding:6px 12px}
details.pj summary{cursor:pointer;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 0}
.srow{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12px}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
tr.prow{cursor:grab}tr.prow.off td{opacity:.4}tr.prow.off td:nth-child(2){opacity:1}
@media(max-width:1000px){main{grid-template-columns:1fr}#vsplit,#hsplit{display:none}.pb{grid-template-columns:1fr}}
#ctl{gap:4px}#ctl .bt{padding:4px 7px}#seek{flex:1 1 110px}.tm{min-width:84px}
/* ===== BASINGAME · tema azul refinado ===== */
:root{--bg:#070b13;--p1:#0c1220;--p2:#121a2c;--p3:#19233b;--bd:#1b2640;--bd2:#2a3a5e;--tx:#e8edf8;--mu:#8795b3;--ac:#4d84ff;--ac2:#2f63e8;--acs:#4d84ff2e;--ok:#3ecf8e;--rd:#f0605d;--r:10px}
html,body{font-family:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
*{scrollbar-width:thin;scrollbar-color:#2a3a5e transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#22304f;border-radius:9px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-thumb:hover{background:#34487a;background-clip:content-box}
header{background:linear-gradient(180deg,#0f1729,#0b1120);border-bottom:1px solid var(--bd);padding:7px 14px;gap:6px}
.brand{height:38px;width:auto;display:block;margin-right:2px;filter:drop-shadow(0 2px 8px #0009)}.brand.big{height:64px}
.appn{font-size:10px;letter-spacing:.34em;color:var(--mu);font-weight:600;margin:0 12px 0 4px}
#pName{width:230px;background:#0a1020;border-radius:9px}
.bt{background:var(--p2);border:1px solid var(--bd);border-radius:9px;padding:5px 12px;color:var(--tx);transition:background .15s,border-color .15s,transform .05s,box-shadow .15s}
.bt:hover{background:var(--p3);border-color:var(--bd2)}
.bt:active{transform:translateY(1px)}
.bt:disabled{opacity:.4;cursor:default}
.bt.on,.bt.pri,.tab.on,.ib.pri{background:linear-gradient(180deg,#5b90ff,#3a6df0);border-color:#5b90ff;color:#fff;font-weight:600;box-shadow:0 1px 0 #ffffff33 inset,0 6px 18px -6px #2f63e8aa}
.bt.pri:hover,.ib.pri:hover,.bt.on:hover{background:linear-gradient(180deg,#6b9bff,#4378f4);border-color:#6b9bff}
.bt.dng{color:#ff8a87}.bt.dng:hover{background:#3a1519;border-color:#6b2a30}
.bt.sm{padding:3px 9px;font-size:12px;border-radius:8px}
.ib{border-radius:10px;color:#b4c1dc;transition:background .15s,color .15s}
.ib:hover{background:var(--p3);color:#fff;border-color:var(--bd)}
.ib.pri{color:#fff}
.sepv{background:var(--bd)}
input[type=text],input[type=number],select,textarea{background:#0a1020;border:1px solid var(--bd);border-radius:9px;padding:6px 9px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.chip{background:#1a2644;color:#c9d6f2;border-radius:999px;padding:1px 9px}
.chip.btn:hover{background:#243562}.chip.btn.on{background:var(--ac);color:#fff}
.tabs{padding:10px 12px 0;gap:5px}
.tab{background:transparent;border:1px solid var(--bd);border-bottom:1px solid var(--bd);border-radius:999px;padding:4px 13px;color:var(--mu);transition:.15s}
.tab:hover{color:#fff;border-color:var(--bd2)}
.tab.on{color:#fff;border-color:#5b90ff}
.left{background:var(--bg)}
.right{background:linear-gradient(180deg,#0d1424,#090e19);border-left:1px solid var(--bd)}
#stage{box-shadow:0 0 0 1px #000}
#ctl{background:linear-gradient(180deg,#0e1628,#0b1120);border-top:1px solid var(--bd);padding:7px 12px}
#ctl .bt{background:transparent;border-color:transparent;color:#a9b7d4;padding:4px 8px;font-variant-numeric:tabular-nums}
#ctl .bt:hover{background:var(--p3);color:#fff}
#ctl .bt.pri{background:linear-gradient(180deg,#5b90ff,#3a6df0);color:#fff;border-radius:50%;width:38px;height:38px;min-width:38px!important;padding:0;box-shadow:0 6px 16px -4px #2f63e8cc}
.tm{color:#9fb0d2;font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;height:18px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#1f2b47}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;margin-top:-5px;box-shadow:0 0 0 3px #4d84ff66,0 2px 6px #0009}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:#1f2b47}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--ac)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
#seek::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--ac) var(--p,0%),#1f2b47 var(--p,0%))}
#tl{background:#0a101d;border-top:1px solid var(--bd)}
.lane{background:#0e1627;border-radius:5px}.seg{border-radius:4px}
#ph{background:#fff;box-shadow:0 0 8px #4d84ffcc}
#pbp{background:var(--bg)}
.pbh{background:#0c1220f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--bd);padding:8px 12px}
th{background:#080d17;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#6f7f9f}
td{border-top:1px solid #131c30}
tr.row:hover td{background:#111a2e}tr.row.sel td{background:#14224a}tr.row.now td{box-shadow:inset 3px 0 var(--ac)}
#btabs{background:#0a101d;padding:8px 12px 0}
.kb{border-radius:12px;border:1px solid #ffffff24;box-shadow:0 1px 0 #ffffff30 inset,0 8px 16px -8px #000d;transition:transform .12s,filter .12s,box-shadow .12s}
.kb:hover{transform:translateY(-1px);filter:brightness(1.1);box-shadow:0 1px 0 #ffffff30 inset,0 12px 20px -8px #000}
.kb:active{transform:scale(.97)}
.kb.desc{border-radius:999px}
#editor{background:#0b1222;border-top:1px solid var(--bd)}
.hint{color:#71819f}
#foot{background:linear-gradient(180deg,#0d1424,#090e19);border-top:1px solid var(--bd);padding:8px 14px}
#foot .bt.pri{padding:7px 22px;border-radius:10px;letter-spacing:.02em}
#modal{background:#02050ccf;backdrop-filter:blur(7px)}
#mbox{background:linear-gradient(180deg,#0f1729,#0b1120);border:1px solid var(--bd2);border-radius:18px;box-shadow:0 40px 100px #000c;padding:22px 24px}
#mbox.wide{width:min(940px,95vw)}
#mbox h3{font-size:17px;font-weight:650;letter-spacing:.01em;margin:0 0 14px}
.li{border-radius:10px;background:#0c1322}
.card{background:linear-gradient(180deg,#121b30,#0d1424);border:1px solid var(--bd);border-radius:16px;padding:16px;transition:transform .15s,border-color .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);border-color:var(--bd2);box-shadow:0 18px 40px -18px #000}
#lib,#pres{background:radial-gradient(900px 420px at 85% -8%,#10224c 0%,transparent 65%),var(--bg)}
.ph{background:#0b1120e6;backdrop-filter:blur(8px)}.pf{background:#0b1120}
.pcol{border-right:1px solid var(--bd)}
details.pj{border-bottom:1px solid var(--bd)}
.lbw h2{color:#8795b3;font-weight:600;letter-spacing:.18em}
.tbar{background:#0a1020;border-radius:8px}.tbar .rg{background:#4d84ff3a;border-color:var(--ac)}
#vsplit,#hsplit{background:#162038}
pre.cmd{background:#080d17}
.pgb{height:6px;background:#0a1020;border-radius:6px}.pgb i{background:linear-gradient(90deg,#3a6df0,#7aa5ff);transition:width .2s}
#empty{background:radial-gradient(600px 300px at 50% 35%,#0f1d3d 0%,#000 70%)}
#empty .emptylogo{width:min(260px,50%);height:auto;filter:drop-shadow(0 8px 24px #000c);margin-bottom:6px}
.seg2{display:inline-flex;background:#080d17;border:1px solid var(--bd);border-radius:12px;padding:3px;gap:3px}
.seg2 button{border:0;background:transparent;color:var(--mu);padding:7px 16px;border-radius:9px;font-weight:600;transition:.15s}
.seg2 button:hover{color:#fff}
.seg2 button.on{background:linear-gradient(180deg,#5b90ff,#3a6df0);color:#fff;box-shadow:0 6px 16px -6px #2f63e8cc}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--bd2);border-radius:14px;padding:26px 16px;text-align:center;cursor:pointer;color:var(--mu);background:#0a1020;transition:.15s;grid-column:1/-1}
.drop:hover,.drop.dr{border-color:var(--ac);color:var(--tx);background:#0d1630}
.drop b{color:var(--tx);font-size:14px}
.xg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
@media(max-width:760px){.xg{grid-template-columns:1fr}}
.ovh{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mu);font-weight:600;margin-bottom:8px}
.ovg{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.ovg label{display:flex;flex-direction:column;gap:3px;color:var(--mu);font-size:11px}
.ovr{grid-column:1/-1;display:flex;align-items:center;gap:8px}
.ovg .ovr .ck{flex:1;display:flex;flex-direction:row;gap:7px;align-items:center;color:var(--tx);font-size:12px;min-width:0;flex-wrap:wrap}
.ovg .ovr .ck small{color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovr select{width:92px}
.pv{display:block;width:100%;border:1px solid var(--bd);border-radius:12px;background:#000}
.xs{font-size:11px}
.vrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:3px 0;padding:5px 8px;border-radius:9px;border:1px solid transparent}
.vrow.need{animation:nd 1s 3;border-color:#ef535055}
@keyframes nd{50%{background:#ef535026}}
#tip{position:fixed;left:0;top:0;z-index:300;max-width:290px;padding:8px 11px;border-radius:10px;background:#0a1124f5;border:1px solid var(--bd2);color:var(--tx);font-size:12px;line-height:1.4;box-shadow:0 14px 34px #000b;pointer-events:none;opacity:0;transform:translateY(3px);transition:opacity .12s,transform .12s;display:flex;flex-direction:column;gap:2px}
#tip.on{opacity:1;transform:none}
#tip b{color:#a9c2ff;font-weight:650;font-size:12px}
#tip span{color:#c3cde4}

/* ===== tipografía deportiva ===== */
html,body{font-family:"Barlow","Segoe UI",-apple-system,Roboto,sans-serif;font-size:14px}
button,input,select,textarea{font-family:inherit}
.kb,.tab,.appn,.ovh,th,.lbw h2,.seg2 button,#mbox h3,.card b,#tip b,.ib.wide span,#foot .bt.pri,.bt.pri{font-family:"Barlow Condensed","Barlow",Impact,sans-serif}
#mbox h3{font-size:24px;font-weight:700;font-style:italic;text-transform:uppercase;letter-spacing:.02em}
.lbw h2{font-size:17px;font-weight:600;letter-spacing:.16em}
.ovh,th{font-weight:600;letter-spacing:.14em}
.tab{font-size:15px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.bt.pri,#foot .bt.pri{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.appn{font-size:13px;font-weight:600;letter-spacing:.3em}
.card b{font-size:19px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
.seg2 button{font-size:15px;letter-spacing:.05em;text-transform:uppercase}
/* botonera: la letra se achica junto con el botón */
#pad{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}
.kb{container-type:inline-size;font-size:inherit;padding:6px 3px;min-height:52px}
.kb>span:not(.k):not(.gear):not(.x){font-size:clamp(9px,13cqw,16px);font-weight:700;letter-spacing:.04em;line-height:1.1;max-width:100%;overflow-wrap:break-word;hyphens:manual;text-align:center;text-transform:uppercase}
.kb.desc>span:not(.k):not(.gear):not(.x){font-size:clamp(9px,12cqw,15px);text-transform:none;letter-spacing:.02em;font-weight:600}
.kb small{font-size:clamp(8px,8cqw,11px)}
.kb .k{font-size:clamp(8px,8cqw,11px)}
#dcv{position:absolute;pointer-events:none;z-index:4}
body.drawing #dcv{pointer-events:auto;cursor:crosshair}
#dtb{display:none;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;padding:7px 12px;background:linear-gradient(180deg,#101a33,#0b1224);border-top:1px solid var(--bd2)}
body.drawing #dtb{display:flex}
#dtb .dgrp{display:flex;align-items:center;gap:5px}
#dtb .dbt{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--p2);color:#cfd9f2;font-size:15px;line-height:1}
#dtb .dbt:hover{background:var(--p3)}#dtb .dbt.on{background:linear-gradient(180deg,#5b90ff,#3a6df0);border-color:#5b90ff;color:#fff}
#dtb .dcol{width:20px;height:20px;border-radius:50%;border:2px solid #0008;box-shadow:0 0 0 1px #ffffff40}
#dtb .dcol.on{box-shadow:0 0 0 2px #fff}
#dtb select,#dtb input{padding:3px 6px;font-size:12px}#dtb input{width:46px}
#dtb .dvis{display:flex;align-items:center;gap:4px;color:var(--mu);font-size:12px}
body.drawing #bDraw{background:var(--ac);color:#fff}
.nseg{background:#ffd400!important}
/* ===== Botones modernos ===== */
.bt,.ib{font-family:Inter,"SF Pro Text",-apple-system,"Segoe UI",sans-serif;font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;border-radius:10px;padding:7px 14px;background:linear-gradient(180deg,#ffffff0a,#ffffff04);border:1px solid #ffffff17;color:#dbe4f7;box-shadow:0 1px 0 #ffffff0d inset;transition:background .2s,border-color .2s,transform .15s,box-shadow .2s,color .2s}
.bt:hover,.ib:hover{background:linear-gradient(180deg,#ffffff14,#ffffff08);border-color:#ffffff30;color:#fff}
.bt:active,.ib:active{transform:translateY(1px) scale(.985)}
.bt.pri,#foot .bt.pri,.bt.on,.tab.on,.ib.pri{position:relative;overflow:hidden;font-family:Inter,"SF Pro Text",-apple-system,"Segoe UI",sans-serif;font-size:13.5px;font-weight:600;letter-spacing:.005em;text-transform:none;color:#fff;border:1px solid #6b9bff55;border-radius:11px;background:linear-gradient(180deg,#5b8fff 0%,#3d70f0 55%,#3562e0 100%);box-shadow:0 1px 0 #ffffff40 inset,0 -1px 0 #0000001f inset,0 8px 22px -10px #3d70f0,0 2px 6px -2px #0006}
#foot .bt.pri{padding:10px 26px}
.bt.pri::after,#foot .bt.pri::after,.ib.pri::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,#ffffff40,transparent);transform:skewX(-20deg);transition:left .6s}
.bt.pri:hover::after,#foot .bt.pri:hover::after,.ib.pri:hover::after{left:130%}
.bt.pri:hover,#foot .bt.pri:hover,.ib.pri:hover,.bt.on:hover{background:linear-gradient(180deg,#6d9bff 0%,#4a7cf4 55%,#3f6ce8 100%);border-color:#8ab0ff88;transform:translateY(-1px);box-shadow:0 1px 0 #ffffff50 inset,0 14px 28px -12px #4d84ff,0 2px 6px -2px #0006}
.bt.pri:active,#foot .bt.pri:active{transform:translateY(0) scale(.985)}
.bt.pri:disabled,#foot .bt.pri:disabled{filter:saturate(.4) brightness(.8);transform:none;box-shadow:none}
.bt.dng:hover{background:#3a151980;border-color:#a33a3f;color:#ff9b98}
#ctl .bt{background:transparent;border-color:transparent;box-shadow:none}
#ctl .bt:hover{background:#ffffff10;border-color:#ffffff1c}
#ctl .bt.pri{border-radius:50%;padding:0;background:linear-gradient(180deg,#5b8fff,#3562e0)}
#ctl .bt.pri::after{display:none}
.tab{font-family:Inter,sans-serif;font-weight:500;text-transform:none;letter-spacing:0}
.tab.on{box-shadow:0 1px 0 #ffffff30 inset,0 6px 16px -8px #3d70f0}


/* inicio v3: tarjetas editoriales */
.hmtop{position:relative;justify-content:center}.hmk{position:absolute;right:0;top:50%;transform:translateY(-50%)}
.hmlogo{height:60px;max-width:210px}
.hmg{gap:14px}
.hmt{min-height:170px;padding:18px 20px 18px 22px;border-radius:4px;border:1px solid #1a2542;border-left:3px solid #2f63e8;background:#09101f;gap:4px;justify-content:flex-end;box-shadow:none}
.hmt::before{inset:0;background:repeating-linear-gradient(135deg,#ffffff05 0 1px,transparent 1px 9px);opacity:1}
.hmt:hover{transform:translateY(-3px);border-color:#2f63e8;background:#0c1630;box-shadow:0 18px 40px -22px #2f63e8}
.hmnum{position:absolute;left:20px;top:12px;font:700 46px/1 "Barlow Condensed",sans-serif;font-style:normal;color:transparent;-webkit-text-stroke:1px #2c4a8f;transition:.3s}
.hmt:hover .hmnum{color:#2f63e8;-webkit-text-stroke-color:#2f63e8}
.hmi{position:absolute;right:16px;top:16px;width:auto;height:auto;margin:0;background:none;border:0;box-shadow:none;color:#6f93ee}
.hmt:hover .hmi{background:none;border:0;box-shadow:none;color:#fff}
.hmi svg{width:26px;height:26px;stroke-width:1.4}
.hmt b{font:700 21px/1.05 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em}
.hmt span:not(.hmi){font-size:12px;color:#7d8cab}
.hmt.live{border-left-color:#e0393e}.hmt.live .hmnum{-webkit-text-stroke-color:#6b2a30}.hmt.live .hmi{background:none;border:0;color:#ff6b68}
.hmt.live:hover{border-color:#e0393e;background:#1a0c13;box-shadow:0 18px 40px -22px #e0393e}.hmt.live:hover .hmnum{color:#e0393e;-webkit-text-stroke-color:#e0393e}.hmt.live:hover .hmi{background:none;border:0;box-shadow:none;color:#fff}
.hmt.live .hmi::after{right:-6px;top:-2px}
.hmart .bk{filter:drop-shadow(0 18px 24px #000a)}
.hmhero{grid-template-columns:1fr minmax(260px,400px)}

.hms,.hmm{position:relative;z-index:1}
.hms{background:linear-gradient(180deg,#081529f2,#06111ef2);border-right:1px solid #c8a74d22}
.hmown{border-color:#c8a74d30;background:linear-gradient(180deg,#0d1a39cc,#0a1830cc)}.hmown::before{background:linear-gradient(90deg,transparent,#c8a74d,transparent)}
.hmav{width:54px;height:54px;padding:2px;background:conic-gradient(from 0deg,#8f7424,#e6cf8a,#c8a74d,#8f7424);animation:hmSpin 10s linear infinite}
.hmav i{display:grid;place-items:center;background:#06111e;animation:hmSpin 10s linear infinite reverse}
.hmav img{width:56%;height:auto;display:block}
.hmn{font:600 19px/1.1 Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase}
.hmr{font:400 12px Inter,sans-serif;color:#aebbd3}.hmc{color:#c8a74d;font:500 10px Oswald,sans-serif;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
.hmic{border-color:#c8a74d33;background:#0a1830;color:#c8a74d}.hmic:hover{background:#c8a74d;border-color:#c8a74d;color:#06111e;box-shadow:0 8px 18px -8px #c8a74d}
.hmweb{position:relative;overflow:hidden;justify-content:center;gap:10px;padding:12px 16px;border-radius:6px;background:transparent;border:1px solid #c8a74d;color:#c8a74d;font:600 12px Oswald,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.hmweb::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#c8a74d44,transparent);transform:skewX(-20deg);animation:hmGlare 4.5s ease-in-out infinite}
.hmweb:hover{background:#c8a74d;color:#06111e;box-shadow:0 10px 26px -12px #c8a74d}
@keyframes hmGlare{0%,60%{left:-60%}100%{left:130%}}
.hmos{margin-top:auto;display:flex;flex-direction:column;gap:9px;padding:14px 4px 4px;border-top:1px solid #c8a74d22}
.hmosl{font:500 9.5px Oswald,sans-serif;letter-spacing:.28em;text-transform:uppercase;color:#64748b}
.hmosr{display:flex;align-items:center;gap:14px;color:#dfe6f3}.hmosr i{width:1px;height:20px;background:#c8a74d44}
.hmosr span{display:flex;align-items:center;gap:8px;font:500 15px Oswald,sans-serif;letter-spacing:.06em}
.hmosr svg{width:20px;height:20px;color:#c8a74d}
.hmln{margin-top:0}
.hmln button{font:500 12px Oswald,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#94a3b8}.hmln button:hover{color:#c8a74d}
.hmeb{font:500 12px Oswald,sans-serif;letter-spacing:.3em;color:#c8a74d}.hmeb::before{background:#c8a74d}

.hmt b{font:600 17px/1.15 Oswald,sans-serif;letter-spacing:.08em}

.hmt.live{border-left-color:#ef4444}.hmt.live:hover{border-color:#ef4444;background:#1a1020;box-shadow:0 18px 40px -22px #ef4444}.hmt.live .hmnum{-webkit-text-stroke-color:#ef444466}.hmt.live:hover .hmnum{color:#ef4444;-webkit-text-stroke-color:#ef4444}

/* inicio v5: sidebar sobrio, descubrí, idioma */
.hmtop{justify-content:center}
.hmlogo{height:56px}
.hmown{align-items:center;text-align:center;border-color:#1b2846;background:#0a1224;padding:20px 16px;gap:4px}.hmown::before{background:linear-gradient(90deg,transparent,#ffffff22,transparent)}
.hmn{font:600 20px/1.1 Oswald,sans-serif;letter-spacing:.1em;color:#fff}
.hmr{color:#aab6cc}.hmc{color:#6f7d98;letter-spacing:.14em}
.hmct{justify-content:center;margin-top:14px}
.hmic{border-color:#1f2d4d;background:#0b1428;color:#9fb0cf}.hmic:hover{background:#ffffff14;border-color:#ffffff40;color:#fff;box-shadow:none}
.hmweb{width:100%;margin-top:14px;border-color:#ffffff30;color:#dbe4f7}.hmweb::after{display:none}.hmweb:hover{background:#ffffff12;color:#fff;box-shadow:none;border-color:#ffffff60}
.hmosr svg{color:#8795b3}.hmos{border-top-color:#16213a}.hmosr i{background:#1f2d4d}
.hmln button:hover{color:#fff}
.hmbar{display:flex;justify-content:flex-end;padding:20px 0 0}
.hmlang{display:flex;align-items:center;gap:8px;padding:5px;border-radius:40px;border:1px solid #1f2d4d;background:#0a1224}
.hmfl{width:34px;height:34px;padding:0;border-radius:50%;border:2px solid transparent;background:none;cursor:pointer;opacity:.7;transition:.2s;display:grid;place-items:center}
.hmfl svg{width:100%;height:100%;border-radius:50%;display:block}
.hmfl:hover{opacity:1;transform:translateY(-1px)}.hmfl.on{opacity:1;border-color:#c8a74d;padding:2px}
.hmhero{padding:14px 0 4px;min-height:0;grid-template-columns:1fr auto}
.hmdisc{display:flex;flex-direction:column;align-items:flex-end;gap:8px;animation:hmUp .7s .2s backwards}
.hmdl{font:500 10px Oswald,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#64748b}
.hmdr{display:flex;gap:10px}
.hmdc{display:flex;flex-direction:column;align-items:center;gap:7px;width:84px;padding:10px 6px 8px;border-radius:10px;border:1px solid #1b2846;background:#0a1224;color:#9fb0cf;cursor:pointer;transition:.25s}
.hmdc:hover{transform:translateY(-3px);border-color:#c8a74d88;color:#fff;background:#0d1a39}
.hmdt{height:54px;display:grid;place-items:center}.hmdt img{height:54px;width:auto;border-radius:3px;box-shadow:0 6px 14px -4px #000}
.hmdt svg{width:34px;height:34px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.hmdc small{font:500 10px Oswald,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.hmg{margin-top:20px}
.hmim{display:flex;gap:20px;align-items:center;max-width:520px}.hmim img{height:210px;width:auto;border-radius:6px;box-shadow:0 14px 30px -10px #000}
.hmiic{width:120px;height:120px;flex:none;border-radius:14px;border:1px solid #c8a74d44;display:grid;place-items:center;color:#c8a74d;background:#0a1224}.hmiic svg{width:56px;height:56px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.hmik{font:500 11px Oswald,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#c8a74d}
.hmim h3{margin:6px 0 8px;font:600 24px/1.1 Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase}
.hmim p{color:#9fb0cf;font-size:13.5px;line-height:1.55;margin:0}
.hmia{display:flex;gap:10px;margin-top:16px}.hmia .bt{text-decoration:none}
@media(max-width:1100px){.hmhero{grid-template-columns:1fr}.hmdisc{align-items:flex-start}.hmim{flex-direction:column;align-items:flex-start}}
/* inicio: sin superposiciones en pantallas bajas */
#home{grid-template-rows:minmax(100%,auto);align-items:stretch}
.hmm>*,.hms>*{flex-shrink:0}.hmm{min-height:0}
.hmg{grid-auto-rows:minmax(150px,auto)}
.hmt{min-height:150px}
@media(max-width:1000px){.hmhero{grid-template-columns:1fr}.hmdisc{align-items:flex-start}.hmg{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ===== correcciones v7 ===== */
#home{grid-template-rows:100%;overflow:hidden}
.hms{min-height:0;overflow:hidden;gap:12px;padding:18px 20px}
.hmm{min-height:0;overflow:hidden;padding:0 40px 20px}
.hmm>*,.hms>*{flex-shrink:0}
/* Descubrí chico */
.hmdisc{flex-direction:row;align-items:center;gap:10px}
.hmdr{gap:6px}
.hmdc{width:30px;height:30px;padding:0;border-radius:7px;display:grid;place-items:center;background:#0a1224;border:1px solid #1d2b4a;color:#8f9db8}
.hmdc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hmdc:hover{transform:none;color:#c8a74d;border-color:#c8a74d88;background:#0a1224}
.hmdl{font-size:9px;letter-spacing:.24em}
.hmhero{padding:6px 0 0;align-items:center}
/* tarjetas: simples, horizontales, sin números ni rayas */
.hmg{flex:1;min-height:0;grid-auto-rows:1fr;gap:12px;margin-top:18px;align-content:start;max-height:230px}
.hmt{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;padding:0 18px;border:1px solid #1b2846;border-left:1px solid #1b2846;border-radius:10px;background:#0a1530;box-shadow:none;text-align:left;flex-wrap:wrap;align-content:center}
.hmt::before{display:none}
.hmnum{display:none}
.hmi{position:static;flex:none;width:42px;height:42px;margin:0;border:1px solid #243558;border-radius:10px;background:#0d1a39;display:grid;place-items:center;color:#c8a74d}
.hmi svg{width:21px;height:21px}
.hmt b{flex:1;min-width:0;font:600 15px Inter,sans-serif;letter-spacing:.01em;text-transform:none;color:#fff}
.hmt span:not(.hmi){flex-basis:100%;padding-left:56px;margin-top:-20px;font-size:12px;color:#8190ad}
.hmt:hover{transform:translateY(-2px);border-color:#c8a74d99;background:#0d1a3a;box-shadow:0 12px 26px -16px #000}
.hmt:hover .hmi{background:#0d1a39;color:#c8a74d;border-color:#c8a74d88;box-shadow:none}
.hmt.live{border-left:1px solid #1b2846}.hmt.live .hmi{background:#1a0f1c;color:#ef6b68;border-color:#5a2a33}.hmt.live:hover{border-color:#ef444499;background:#160d1c;box-shadow:0 12px 26px -16px #000}.hmt.live:hover .hmi{background:#1a0f1c;color:#ef6b68;border-color:#5a2a33;box-shadow:none}
.hmf{padding-top:12px}
.hmt{display:grid;grid-template-columns:42px minmax(0,1fr);column-gap:14px;row-gap:2px;align-content:center;align-items:center}
.hmi{position:relative;right:auto;top:auto;grid-row:1/3;align-self:center}
.hmt b{grid-column:2;align-self:end}
.hmt span:not(.hmi){grid-column:2;flex-basis:auto;padding-left:0;margin-top:0;align-self:start}
.hmt.live .hmi::after{right:-3px;top:-3px}
/* barra lateral que no se desplaza: se compacta según la altura */
@media(max-height:760px){.hmos{display:none}.hmlogo{height:44px}.hmown{padding:14px 14px}}
@media(max-height:600px){.hms{gap:8px;padding:10px 16px}.hmlogo{height:34px}.hmct{margin-top:8px}.hmweb{margin-top:8px;padding:8px}.hmln button{padding:7px 12px}.hmm h1{font-size:30px}.hmsub{display:none}.hmg{margin-top:10px}}
@media(max-height:480px){.hmweb,.hmc{display:none}.hmln button{padding:5px 12px}.hmhero{padding-top:0}.hmbar{padding-top:10px}.hmf{display:none}}

/* ===== v8: tarjetas con marca de agua, barra lateral sin caja, letras más grandes ===== */
.hmown{background:none;border:0;border-top:1px solid #16213a;border-bottom:1px solid #16213a;border-radius:0;padding:18px 4px;box-shadow:none}
.hmown::before{display:none}
.hmn{font-size:22px}.hmr{font-size:14px}.hmc{font-size:11.5px}
.hmic{width:36px;height:36px}.hmic svg{width:17px;height:17px}
.hmweb{border:0;padding:8px 0;margin-top:8px;background:none;color:#dbe4f7;font-size:13.5px;text-decoration:underline;text-underline-offset:5px;text-decoration-color:#ffffff40;justify-content:center}.hmweb:hover{background:none;color:#fff;text-decoration-color:#fff}
.hmosl{font-size:11px}.hmosr span{font-size:17px}.hmosr svg{width:22px;height:22px}
.hmln button{font-size:13.5px;padding:12px}
.hmeb{font-size:13.5px}.hmsub{font-size:16.5px;max-width:52ch}
.hmm h1{font-size:clamp(34px,4vw,54px)}
.hmdl{font-size:10.5px}
.hmt{position:relative;overflow:hidden;background:#0c1836;border:1px solid #1b2846;border-bottom:2px solid #1b2846;border-radius:12px;padding:0 22px;column-gap:16px}
.hmt::after{content:"";position:absolute;left:0;bottom:-2px;height:2px;width:100%;background:#c8a74d;transform:scaleX(0);transform-origin:left;transition:transform .35s}
.hmt:hover::after{transform:scaleX(1)}
.hmt.live::after{background:#ef4444}
.hmwm{position:absolute;right:-6px;bottom:-14px;width:104px;height:104px;opacity:.045;color:#fff;pointer-events:none;transition:opacity .3s,transform .3s}
.hmwm svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.2}
.hmt:hover .hmwm{opacity:.13;transform:translate(-4px,-4px)}
.hmi{width:48px;height:48px;border-radius:12px}.hmi svg{width:24px;height:24px}
.hmt{grid-template-columns:48px minmax(0,1fr)}
.hmt b{font-size:18px;line-height:1.15}
.hmt span:not(.hmi){font-size:14px;line-height:1.35}
.hmg{max-height:270px}
@media(max-height:600px){.hmt b{font-size:16px}.hmt span:not(.hmi){font-size:12.5px}.hmsub{display:none}}

/* v9: pie de la barra lateral */
.hmwm{display:none}
.hmfoot{margin-top:auto;display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid #16213a}

/* v10: Windows / macOS sin recuadros */
.hmosl{display:none}
.hmfoot .hmosr{gap:18px;align-items:center}
.hmchip{padding:0;border:0;background:none;border-radius:0;gap:8px;font:600 15px Inter,sans-serif;letter-spacing:0;color:#fff}
.hmchip svg{width:22px;height:22px;color:#fff}
.hmfoot{gap:14px}
.hmfoot .hmosr span.hmchip{font:600 15px Inter,sans-serif;letter-spacing:0}
/* v11 */
.hmlogo{height:84px;max-width:250px}
@media(max-height:760px){.hmlogo{height:66px}}

.hmfoot{justify-content:center}
.hmfoot .hmosr{justify-content:center}
.hmm{position:relative}
.hmball{position:absolute;right:40px;bottom:16px;width:54px;height:auto;filter:drop-shadow(0 3px 8px #000a);pointer-events:none}
@media(max-height:560px){.hmball{display:none}}

<body>
<div id="app">
<header>

  <span class="sepv"></span>

  <span class="sepv"></span>

  <button class="ib" data-a="exportCsv" title="Exportar CSV (tiempos y links)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></button>

/* ====================== IndexedDB ====================== */
const DB={db:null,
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('basingame_va',2);r.onupgradeneeded=()=>{const d=r.result;['projects','templates','pres','handles'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'})})};r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  tx(st,mode,fn){return new Promise((res,rej)=>{if(!DB.db)return res(null);const t=DB.db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})},
  put(st,v){return DB.tx(st,'readwrite',s=>s.put(v))},
  get(st,id){return DB.tx(st,'readonly',s=>s.get(id))},
  all(st){return DB.tx(st,'readonly',s=>s.getAll()).then(r=>r||[])},
  del(st,id){return DB.tx(st,'readwrite',s=>s.delete(id))}
};
function projData(){return {id:S.proj.id,name:S.proj.name,date:S.proj.date,src:S.proj.src,ytUrl:S.proj.ytUrl,counter:S.proj.counter,exp:S.proj.exp,mont:S.proj.mont,allBtns:S.proj.allBtns,notes:S.proj.notes||[],tpl:S.tpl,actions:S.actions,saved:Date.now()}}

  dur(){if(this.kind==='file')return this.v.duration||0;if(this.kind==='yt'&&this.yt&&this.yt.getDuration){let d=this.yt.getDuration()||0;let live=false;try{live=!!(this.yt.getVideoData&&this.yt.getVideoData().isLive)}catch(e){}if(live||!d)d=Math.max(d,this.maxT||0);return d}return 0},
  seek(x){x=clamp(x,0,this.dur()||1e9);if(this.kind==='file')this.v.currentTime=x;else if(this.kind==='yt'&&this.yt)this.yt.seekTo(x,true)},
  play(){if(this.kind==='file')this.v.play();else if(this.yt)this.yt.playVideo()},
  pause(){if(this.kind==='file')this.v.pause();else if(this.yt)this.yt.pauseVideo()},
  paused(){if(this.kind==='file')return this.v.paused;if(this.yt&&this.yt.getPlayerState)return this.yt.getPlayerState()!==1;return true},
  rate(r){if(this.kind==='file')this.v.playbackRate=r;else if(this.yt&&this.yt.setPlaybackRate)this.yt.setPlaybackRate(r)},
  vol(x){if(this.kind==='file')this.v.volume=x;else if(this.yt&&this.yt.setVolume)this.yt.setVolume(x*100)},
  isLive(){try{return this.kind==='yt'&&!!(this.yt&&this.yt.getVideoData&&this.yt.getVideoData().isLive)}catch(e){return false}},
  ready(){return this.kind==='file'?!!this.v.src:(this.kind==='yt'&&this.ytReady)}
};

/* ====================== YouTube sin servidor: puente ====================== */
const YT_BRIDGE='https://ginobasignana-web.github.io/x7k2m9p4q/yt_bridge.html';
function ytBridgeURL(){try{return localStorage.getItem('bva_bridge')||YT_BRIDGE}catch(e){return YT_BRIDGE}}
function makeBridgePlayer(id,onReady,o){
  o=o||{};
  const box=$('#ytbox');box.innerHTML='';
  const f=document.createElement('iframe');f.allow='autoplay; encrypted-media; fullscreen';f.allowFullscreen=true;f.referrerPolicy='origin';
  f.src=ytBridgeURL()+(ytBridgeURL().includes('?')?'&':'?')+'v='+id+(o.controls===0?'&c=0':'')+(o.start?'&s='+Math.floor(o.start):'');box.appendChild(f);
  const P={bridge:true,st:{t:0,d:0,s:-1,live:false,r:1,at:0},vid:{isLive:false},
    send(m){m.bva=1;try{f.contentWindow.postMessage(m,'*')}catch(e){}},
    getCurrentTime(){const x=this.st;return x.s===1?x.t+(Date.now()-x.at)/1000*(x.r||1):x.t},
    getDuration(){return this.st.d||0},
    getVideoData(){return {isLive:this.st.live}},
    getPlayerState(){return this.st.s},
    seekTo(t){this.send({c:'seek',t});this.st.t=t;this.st.at=Date.now()},
    playVideo(){this.send({c:'play'})},pauseVideo(){this.send({c:'pause'})},
    setPlaybackRate(r){this.send({c:'rate',r})},setVolume(v){this.send({c:'vol',v})},mute(){this.send({c:'mute'})},unMute(){this.send({c:'unmute'})},
    loadVideoById(i){const o=typeof i==='object'?i:{videoId:i};this.send({c:'load',id:o.videoId,s:o.startSeconds||0})},
    destroy(){window.removeEventListener('message',P.h)}};
  P.h=ev=>{
    if(ev.source!==f.contentWindow)return;const m=ev.data;if(!m||!m.bva)return;
    if(m.e==='ready'){P.ok=true;clearTimeout(P.to);onReady&&onReady()}
    else if(m.e==='state'){P.st={t:m.t||0,d:m.d||0,s:m.s,live:!!m.live,r:m.r||1,at:Date.now()};if(!P.ok){P.ok=true;clearTimeout(P.to);onReady&&onReady()}}
    else if(m.e==='error')ytError(m.code);
  };
  window.addEventListener('message',P.h);
  P.to=setTimeout(()=>{if(!P.ok)ytBridgeFail()},9000);
  return P;
}
function ytBridgeFail(){
  openModal(`<h3>No pude conectar con YouTube</h3><p>El Editor usa una página "puente" para reproducir YouTube sin que tengas que instalar nada. No respondió: puede ser que no haya internet o que el puente todavía no esté publicado.</p>${ytHelpHTML()}<div style="margin-top:10px"><button class="bt" data-a="closeM">Cerrar</button></div>`);
}

function ytMount(id,o){
  o=o||{};const ctl=o.controls===0?0:1;
  try{Pl.v.pause()}catch(e){}
  showPlayer('yt');Pl.ytId=id;Pl.maxT=o.keepMax!=null?o.keepMax:0;
  if(Pl.yt&&Pl.ytCtl!==ctl){try{Pl.yt.destroy&&Pl.yt.destroy()}catch(e){}Pl.yt=null;$('#ytbox').innerHTML='<div id="ytp"></div>'}
  Pl.ytCtl=ctl;
  if(location.protocol==='file:'){
    if(Pl.yt&&Pl.yt.destroy){try{Pl.yt.destroy()}catch(e){}}
    Pl.ytReady=false;Pl.yt=makeBridgePlayer(id,()=>{Pl.ytReady=true;renderTL()},{controls:ctl,start:o.start||0});
    return;
  }
  const mk=()=>{
    if(Pl.yt&&Pl.yt.bridge){Pl.yt=null;$('#ytbox').innerHTML='<div id="ytp"></div>'}
    if(Pl.yt&&Pl.yt.loadVideoById){Pl.yt.loadVideoById(o.start?{videoId:id,startSeconds:o.start}:id);Pl.ytReady=true;return}
    Pl.ytReady=false;
    Pl.yt=new YT.Player('ytp',{videoId:id,playerVars:Object.assign({rel:0,modestbranding:1,playsinline:1,controls:ctl,disablekb:ctl?0:1,fs:ctl?1:0,iv_load_policy:ctl?1:3,start:Math.floor(o.start||0)},location.protocol.startsWith('http')?{origin:location.origin}:{}),events:{onError:e=>ytError(e.data),onReady:()=>{Pl.ytReady=true;renderTL()},onStateChange:()=>{$('#seek').max=Pl.dur()||1;renderTL()}}});
  };
  if(window.YT&&YT.Player)mk();else{
    window.onYouTubeIframeAPIReady=mk;
    if(!document.getElementById('ytapi')){const s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';s.onerror=()=>toast('No se pudo cargar YouTube (¿sin internet?)');document.head.appendChild(s)}
  }
}

/* ====================== reproducción de clips ====================== */
function queueFromFilter(){
  let L=S.actions.slice().sort((a,b)=>a.start-b.start);
  if(S.sel.size)L=L.filter(a=>S.sel.has(a.id));
  else if(S.filter)L=L.filter(a=>a.cat===S.filter);
  return L.map(a=>a.id);
}
function playClip(id,queue){
  const a=S.actions.find(x=>x.id===id);if(!a||!Pl.ready())return;
  S.clip={id,queue:queue||[id]};S.cur=id;
  Pl.seek(a.start);Pl.rate(parseFloat($('#rate').value));Pl.play();renderPBP();
}
function stepClip(d){
  if(!S.clip){const q=queueFromFilter();if(q.length)playClip(q[d>0?0:q.length-1],q);return}
  const q=S.clip.queue,i=q.indexOf(S.clip.id)+d;
  if(i<0||i>=q.length){if(S.opt.loop&&q.length)playClip(q[(i+q.length)%q.length],q);else stopClip();return}
  playClip(q[i],q);
}
function stopClip(){S.clip=null;try{Pl.pause()}catch(e){}renderPBP()}
setInterval(()=>{
  if(!S.clip||!Pl.ready())return;
  const a=S.actions.find(x=>x.id===S.clip.id);if(!a){S.clip=null;return}
  const endT=Pl.isLive()?Math.min(a.end,Math.max(a.start+1,Pl.dur()-0.5)):a.end;
  if(Pl.t()>=endT-0.03){
    if(S.clip.queue.length>1&&S.opt.cont)stepClip(1);
    else if(S.opt.loop)Pl.seek(a.start);
    else stopClip();
  }
},60);

function renderPBPtable(){

  const hdr=`<div class="pbh"><b>Play by Play</b><span class="muted">${S.actions.length} acciones</span>
   <select data-f="filter"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${S.filter===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
   <button class="bt sm pri" data-a="playList">&#9654; Reproducir lista</button>
   <button class="bt sm" data-a="prevClip">&#9664;&#9664;</button><button class="bt sm" data-a="nextClip">&#9654;&#9654;</button>
   <label><input type="checkbox" data-f="loop" ${S.opt.loop?'checked':''}> repetir</label>
   <label><input type="checkbox" data-f="cont" ${S.opt.cont?'checked':''}> continuo</label>
   <span class="sp"></span>${S.sel.size?`<button class="bt sm" data-a="selToMont">+ ${S.sel.size} a la lista</button><button class="bt sm pri" data-a="expSel">&#8681; Exportar ${S.sel.size} seleccionado${S.sel.size>1?'s':''} (MP4)</button>`:''}<button class="bt sm" data-a="selAll">Seleccionar</button><button class="bt sm dng" data-a="delSel">Borrar selección</button></div>`;
  const rows=L.filter(a=>!S.filter||a.cat===S.filter).map(a=>{
    const isNow=S.clip&&S.clip.id===a.id;
    let r=`<tr class="row ${S.sel.has(a.id)?'sel':''} ${isNow?'now':''}" data-a="row" data-id="${a.id}">
      <td><input type="checkbox" data-a="chk" data-id="${a.id}" ${S.sel.has(a.id)?'checked':''}></td>
      <td>${a.n}</td><td>${fmt(a.t)}</td>
      <td><span class="dot" style="background:${a.color}"></span>${esc(a.cat)}</td>
      <td>${a.desc.map(d=>`<span class="chip">${esc(d)}</span>`).join('')}${a.note?`<span class="muted"> ${esc(a.note)}</span>`:''}</td>
      <td>${R2(a.end-a.start)} s</td>
      <td style="white-space:nowrap"><button class="bt sm" data-a="clip" data-id="${a.id}" title="Reproducir clip">&#9654;</button>
        <button class="bt sm" data-a="edA" data-id="${a.id}">Editar</button>
        <button class="bt sm" data-a="toMont" data-id="${a.id}" title="Agregar a la lista / montaje">+ Lista</button>
        <button class="bt sm" data-a="expClip" data-id="${a.id}" title="Exportar solo este clip en video">&#8681; MP4</button>
        ${(S.proj.src&&S.proj.src.kind==='yt')||S.proj.ytUrl?`<a class="bt sm" style="text-decoration:none" target="_blank" href="${esc(S.proj.ytUrl||S.proj.src.url)}?t=${Math.floor(a.start)}">link</a>`:''}
        <button class="bt sm dng" data-a="delA" data-id="${a.id}">&#10005;</button></td></tr>`;
    if(S.editAct===a.id)r+=`<tr class="ed"><td colspan="7"><div class="edg" data-edit="${a.id}">
      <label>Inicio (s)<input type="number" step="0.1" data-af="start" value="${a.start}"></label>
      <label>Fin (s)<input type="number" step="0.1" data-af="end" value="${a.end}"></label>
      <label>PRE (s)<input type="number" step="0.5" min="0" data-af="pre" value="${R2(a.t-a.start)}"></label>
      <label>POST (s)<input type="number" step="0.5" min="0" data-af="post" value="${R2(a.end-a.t)}"></label>
      <label>Categoría<select data-af="cat">${cats.map(c=>`<option ${a.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label>Nota<input type="text" data-af="note" value="${esc(a.note)}"></label>
      <div style="display:flex;gap:4px;flex-wrap:wrap"><button class="bt sm" data-a="setStart" data-id="${a.id}">Inicio = ahora</button><button class="bt sm" data-a="setEnd" data-id="${a.id}">Fin = ahora</button><button class="bt sm" data-a="dupA" data-id="${a.id}">Duplicar</button></div>
      <div style="grid-column:1/-1">${dsc.map(d=>`<span class="chip btn ${a.desc.includes(d.name)?'on':''}" data-a="tgD" data-id="${a.id}" data-d="${esc(d.name)}">${esc(d.name)}</span>`).join('')}</div>
    </div></td></tr>`;
    return r;
  }).join('');

  $('#pbp').scrollTop=keep;
}

function download(name,text,type){const b=new Blob([text],{type:type||'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const safe=s=>String(s||'proyecto').replace(/[^\w\-]+/g,'_').slice(0,50);
function exportJson(){download('BVA_'+safe(S.proj.name)+'.json',JSON.stringify({bva:1,...projData()},null,1))}
function exportCsv(){
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const yt=S.proj.src&&S.proj.src.kind==='yt'?S.proj.src.url:(S.proj.ytUrl||'');
  const rows=[['n','tiempo','inicio','fin','duracion_s','categoria','descriptores','nota',yt?'link':''].filter(Boolean)];
  S.actions.slice().sort((a,b)=>a.t-b.t).forEach(a=>rows.push([a.n,fmt(a.t),fmt1(a.start),fmt1(a.end),R2(a.end-a.start),a.cat,a.desc.join(' | '),a.note].concat(yt?[yt+'?t='+Math.floor(a.start)]:[])));
  download('BVA_'+safe(S.proj.name)+'.csv','﻿'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}
function loadProject(p){
  S.proj={id:p.id||uid(),name:p.name||'',date:p.date||'',src:p.src||null,ytUrl:p.ytUrl,counter:p.counter||0,exp:p.exp,mont:p.mont||[],allBtns:!!p.allBtns,notes:p.notes||[]};
  S.editM=null;S.tpl=p.tpl||baseTemplate();S.actions=p.actions||[];S.sel=new Set();S.cur=null;S.active={};S.page=0;S.clip=null;S.editBtn=null;S.editAct=null;
  renderAll();
  if(S.proj.src&&S.proj.src.kind==='yt')loadYT(S.proj.src.url);
  else if(S.proj.src&&S.proj.src.kind==='file'){showPlayerNone();$('#empty').style.display='flex';autoVideo(S.proj.id)}
}

document.addEventListener('keydown',ev=>{
  const tg=ev.target;
  if(V.view!=='app')return;
  if(DR.on){if(ev.key==='Escape')endDraw(false);else if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='z'&&!tg.matches('input,select')){ev.preventDefault();DR.shapes.pop()}return}
  if((ev.metaKey||ev.ctrlKey)&&ev.key.toLowerCase()==='z'&&S.edit&&!tg.matches('input[type=text],input[type=number],textarea,select')){ev.preventDefault();undoT();return}
  if(tg.matches('input[type=text],input[type=number],textarea,select')||ev.metaKey||ev.ctrlKey||ev.altKey)return;
  const k=ev.key.toLowerCase();
  if(!Pl.ready()&&k!=='escape')return;
  if(k===' '){ev.preventDefault();Pl.paused()?Pl.play():Pl.pause();return}
  if(k==='arrowleft'){ev.preventDefault();Pl.seek(Pl.t()-(ev.shiftKey?1:2));return}
  if(k==='arrowright'){ev.preventDefault();Pl.seek(Pl.t()+(ev.shiftKey?1:2));return}
  if(k==='arrowup'){ev.preventDefault();Pl.seek(Pl.t()+(ev.shiftKey?5:15));return}
  if(k==='arrowdown'){ev.preventDefault();Pl.seek(Pl.t()-(ev.shiftKey?5:15));return}
  if(k===','){Pl.pause();Pl.seek(Pl.t()-1/30);return}
  if(k==='.'){Pl.pause();Pl.seek(Pl.t()+1/30);return}
  if(k==='['){stepClip(-1);return}
  if(k===']'){stepClip(1);return}
  if(k==='escape'){if(S.clip)stopClip();if($('#modal').classList.contains('on'))closeModal();return}
  if(S.edit)return;
  for(const p of S.tpl.pages)for(const b of p.buttons)if(b.key&&b.key===k){ev.preventDefault();press(b);return}
  const pi=S.tpl.pages.findIndex(p=>p.key&&p.key===k);
  if(pi>=0&&!S.proj.allBtns){S.page=pi;renderTabs();renderPad();toast('Página: '+S.tpl.pages[pi].name)}
});

/* ====================== ajuste de corte (junto al video) ====================== */
const TR={ws:0,we:1,drag:null,ls:0};
function trimAct(){return S.editM&&S.actions.find(x=>x.id===S.editM)}
function renderTrim(){
  const el=$('#trimbar'),a=trimAct();
  if(!a){el.style.display='none';el.innerHTML='';return}
  el.style.display='block';
  const dur=Pl.dur()||1e9;
  TR.ws=Math.max(0,a.start-15);TR.we=Math.min(dur,a.end+15);if(TR.we<=TR.ws)TR.we=TR.ws+1;
  const nb=(w,d)=>`<button class="bt sm" data-a="nudge" data-id="${a.id}" data-w="${w}" data-d="${d}">${d>0?'+':'−'}${Math.abs(d)}</button>`;
  const D=[-1,-0.5,-0.1,0.1,0.5,1];
  el.innerHTML=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b><span class="dot" style="background:${a.color}"></span>Ajustar corte · #${a.n} ${esc(a.cat)}</b><span class="muted" id="trInfo"></span><span class="sp"></span>
    <button class="bt sm" data-a="trPrev">&#9664; Anterior</button><button class="bt sm" data-a="trNext">Siguiente &#9654;</button><button class="bt sm pri" data-a="mPlayOne" data-id="${a.id}">&#9654; Probar corte</button><button class="bt sm" data-a="mTrim" data-id="${a.id}">Cerrar</button></div>
  <div class="tbar" id="tbar"><div class="rg" id="trRg"></div><div class="hd" data-h="start"></div><div class="hd" data-h="end"></div><div class="ph2" id="trPh"></div></div>
  <div data-medit="${a.id}">
   <div class="tbr"><b>Inicio</b><input type="number" step="0.1" data-mf="start" id="trS">${D.map(d=>nb('start',d)).join('')}<button class="bt sm" data-a="setStart" data-id="${a.id}">= ahora</button></div>
   <div class="tbr"><b>Fin</b><input type="number" step="0.1" data-mf="end" id="trE">${D.map(d=>nb('end',d)).join('')}<button class="bt sm" data-a="setEnd" data-id="${a.id}">= ahora</button></div>
  </div>`;
  updTrim();
}
function updTrim(){
  const a=trimAct();if(!a||!$('#tbar'))return;
  const w=TR.we-TR.ws,p=x=>clamp((x-TR.ws)/w*100,0,100);
  const rg=$('#trRg');rg.style.left=p(a.start)+'%';rg.style.width=Math.max(.3,p(a.end)-p(a.start))+'%';
  const hs=document.querySelectorAll('#tbar .hd');hs[0].style.left=p(a.start)+'%';hs[1].style.left=p(a.end)+'%';
  const i=$('#trInfo');if(i)i.textContent=fmt1(a.start)+' → '+fmt1(a.end)+' · '+R2(a.end-a.start)+' s';
  const s=$('#trS'),e=$('#trE');if(s&&document.activeElement!==s)s.value=a.start;if(e&&document.activeElement!==e)e.value=a.end;
}
function openTrim(id){
  S.editM=id;const a=trimAct();
  if(a){Pl.pause();Pl.seek(a.start)}
  renderTrim();if(S.view==='mont')renderMont();
}
function trimChanged(){updTrim();renderTL();markDirty();if(S.view==='mont')renderMont();else renderPBP()}
document.addEventListener('pointerdown',ev=>{
  const h=ev.target.closest&&ev.target.closest('#tbar .hd');if(!h)return;
  ev.preventDefault();TR.drag=h.dataset.h;
});
document.addEventListener('pointermove',ev=>{
  if(!TR.drag)return;const a=trimAct(),bar=$('#tbar');if(!a||!bar)return;
  const r=bar.getBoundingClientRect(),dur=Pl.dur()||1e9;
  const t=R2(TR.ws+clamp((ev.clientX-r.left)/r.width,0,1)*(TR.we-TR.ws));
  if(TR.drag==='start')a.start=clamp(t,0,a.end-.1);else a.end=clamp(t,a.start+.1,dur);
  updTrim();
  const n=performance.now();if(n-TR.ls>110){TR.ls=n;Pl.seek(TR.drag==='start'?a.start:a.end)}
});
document.addEventListener('pointerup',()=>{
  if(!TR.drag)return;const a=trimAct();const w=TR.drag;TR.drag=null;
  if(a){Pl.seek(w==='start'?a.start:a.end);trimChanged()}
});

  const rows=cvRow+M.map((m,i)=>{const a=A(m.id);
    let r=`<tr class="row mrow ${m.on?'':'off'} ${S.cur===a.id?'sel':''} ${S.clip&&S.clip.id===a.id?'now':''}" draggable="true" data-mi="${i}" data-id="${a.id}" data-a="mrow">

     <td style="white-space:nowrap"><button class="bt sm" data-a="mPlay" data-id="${a.id}">&#9654;</button><button class="bt sm" data-a="mTrim" data-id="${a.id}" title="Ajustar corte (o doble clic)">Ajustar</button><button class="bt sm" data-a="mUp" data-i="${i}">&#9650;</button><button class="bt sm" data-a="mDn" data-i="${i}">&#9660;</button><button class="bt sm dng" data-a="mRm" data-i="${i}">&#10005;</button></td></tr>`;

function mMove(i,j){const M=montList();if(j<0||j>=M.length||i===j)return;const [x]=M.splice(i,1);M.splice(j,0,x);markDirty();renderMont()}
document.addEventListener('click',ev=>{

    case 'mCat':{const M=montList(),A=x=>S.actions.find(q=>q.id===x.id),order=[];M.forEach(m=>{const c=A(m).cat;if(!order.includes(c))order.push(c)});M.sort((p,q)=>order.indexOf(A(p).cat)-order.indexOf(A(q).cat));markDirty();renderMont();break}

    case 'trPrev':case 'trNext':{const M=montList(),i=M.findIndex(m=>m.id===S.editM),j=i+(a==='trNext'?1:-1);if(M[j])openTrim(M[j].id);else toast('No hay más clips en la lista');break}

    case 'nudge':{const x=S.actions.find(q=>q.id===id);if(x){const d=+t.dataset.d;if(t.dataset.w==='start')x.start=R2(clamp(x.start+d,0,x.end-.1));else x.end=R2(clamp(x.end+d,x.start+.1,Pl.dur()||1e9));renderMont();renderTL();markDirty();Pl.seek(t.dataset.w==='start'?x.start:Math.max(x.start,x.end-1.5));updTrim()}break}
  }
  if((a==='setStart'||a==='setEnd')){if(S.editM)updTrim();if(S.view==='mont')renderMont()}
});

function applyUI(){
  document.documentElement.style.setProperty('--rw',UI.rw+'px');
  if(UI.mode==='manual'&&UI.sh)document.documentElement.style.setProperty('--sh',UI.sh+'px');
}
function fitStage(){
  if(UI.mode!=='fit'||document.body.classList.contains('cine')||V.view!=='app')return;
  const left=document.querySelector('.left');if(!left)return;
  let ar=16/9;if(Pl.kind==='file'&&Pl.v.videoWidth)ar=Pl.v.videoWidth/Pl.v.videoHeight;
  const root=document.documentElement,W=window.innerWidth,maxH=Math.max(220,window.innerHeight*0.56);
  let rw=UI.rw;
  if(!UI.rwManual&&W>1000){ // si el video es mas ancho que alto disponible, la botonera gana el espacio sobrante
    const need=maxH*ar;const avail=W-6-rw;
    if(avail>need)rw=Math.round(clamp(W-6-need,UI.rw,760));
  }
  root.style.setProperty('--rw',rw+'px');
  const w=W-6-rw;
  root.style.setProperty('--sh',Math.round(clamp(Math.min(w/ar,maxH),160,maxH))+'px');
}
window.addEventListener('resize',fitStage);
(function(){
  let dr=null;
  document.addEventListener('pointerdown',ev=>{
    const t=ev.target;
    if(t.id==='vsplit'){dr='v';t.classList.add('dr');ev.preventDefault()}
    else if(t.id==='hsplit'){dr='h';t.classList.add('dr');ev.preventDefault()}
  });
  document.addEventListener('pointermove',ev=>{
    if(!dr)return;
    if(dr==='v'){UI.rwManual=true;UI.rw=Math.round(clamp(window.innerWidth-ev.clientX-3,260,Math.min(800,window.innerWidth-360)));document.documentElement.style.setProperty('--rw',UI.rw+'px')}
    else{const top=$('#stage').getBoundingClientRect().top;UI.mode='manual';UI.sh=Math.round(clamp(ev.clientY-top,140,window.innerHeight-250));document.documentElement.style.setProperty('--sh',UI.sh+'px')}
  });
  document.addEventListener('pointerup',()=>{if(!dr)return;document.querySelectorAll('#vsplit,#hsplit').forEach(x=>x.classList.remove('dr'));const was=dr;dr=null;saveUI();if(was==='v')fitStage()});
  document.addEventListener('dblclick',ev=>{if(ev.target.id==='hsplit'){UI.mode='fit';UI.rwManual=false;saveUI();fitStage()}});
})();
function toggleCine(){
  const b=document.body,on=!b.classList.contains('cine');
  b.classList.toggle('cine',on);b.classList.remove('showpad');
  if(on){try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
  else{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){};fitStage()}
}
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('cine')){document.body.classList.remove('cine','showpad');fitStage()}});
function pickVideo(){
  if(window.showOpenFilePicker){
    window.showOpenFilePicker({types:[{description:'Video',accept:{'video/*':['.mp4','.mov','.webm','.m4v','.mkv','.avi']}}]}).then(async([h])=>loadFile(await h.getFile(),h)).catch(e=>{if(e&&e.name!=='AbortError')$('#fileIn').click()});
  }else $('#fileIn').click();
}
async function autoVideo(pid){
  const src=S.proj.src;if(!src||src.kind!=='file')return;
  if(FILES[pid]){loadFile(FILES[pid]);return}
  try{const rec=await DB.get('handles',pid);
    if(rec&&rec.h){let ok=(await rec.h.queryPermission({mode:'read'}))==='granted';if(!ok)ok=(await rec.h.requestPermission({mode:'read'}))==='granted';
      if(ok){loadFile(await rec.h.getFile(),rec.h);return}}}catch(e){}
  toast('Elegí de nuevo el video: '+src.name);
}

function setView(v){
  V.view=v;
  if(document.body.classList.contains('cine'))toggleCine();
  $('#app').style.display=v==='app'?'grid':'none';
  $('#lib').style.display=v==='lib'?'block':'none';
  $('#pres').style.display=v==='pres'?'flex':'none';
  const hm=$('#home');if(hm)hm.style.display=v==='home'?'grid':'none';
  if(v==='lib')renderLib();
  if(v==='app')setTimeout(fitStage,30);
  window.scrollTo(0,0);
}

/* videos necesarios */
function neededPids(){return [...new Set(PRES.items.filter(i=>i.on).map(i=>resolveIt(i)).filter(x=>x.a&&x.p).map(x=>x.p.id))]}
async function pvYt(pid,f){
  const p=PRJ.find(x=>x.id===pid);
  if(p&&p.src&&p.src.kind==='yt'){p.ytUrl=p.src.url;p.src={kind:'file',name:f.name,size:f.size};try{await DB.put('projects',p)}catch(e){}}
}
async function prepVideo(pid,file){
  PV[pid]={status:'loading'};renderPresVids();
  const v=document.createElement('video');v.preload='auto';v.playsInline=true;v.src=URL.createObjectURL(file);
  const r=await new Promise(res=>{v.onloadedmetadata=()=>res('ok');v.onerror=()=>res('err');setTimeout(()=>res('err'),15000)});
  PV[pid]=r==='ok'?{status:'ok',video:v,file}:{status:'err'};renderPresVids();
}
async function prepSilent(){
  for(const pid of neededPids()){
    if(PV[pid]&&PV[pid].status==='ok')continue;
    const p=PRJ.find(x=>x.id===pid);if(!p||!p.src||p.src.kind!=='file'){continue}
    if(FILES[pid]){await prepVideo(pid,FILES[pid]);continue}
    try{const rec=await DB.get('handles',pid);if(rec&&rec.h&&(await rec.h.queryPermission({mode:'read'}))==='granted'){FILES[pid]=await rec.h.getFile();await prepVideo(pid,FILES[pid]);continue}}catch(e){}
    PV[pid]={status:'need'};
  }
  renderPresVids();
}
function presVidRows(){
  const pids=neededPids();
  const rows=pids.map(pid=>{const p=PRJ.find(x=>x.id===pid),st=PV[pid]&&PV[pid].status;
    let r='';
    if(p.src&&p.src.kind==='yt')r='<span class="muted">YouTube: se ve en la simulación · para exportar, cargá el archivo</span> <button class="bt sm" data-a="pvPick" data-pid="'+pid+'">Cargar archivo</button>';
    else if(st==='ok')r='<span style="color:var(--ok)">&#10003; listo</span>';
    else if(st==='loading')r='<span class="muted">cargando…</span>';
    else if(st==='err')r='<span style="color:var(--rd)">no se pudo abrir ese archivo</span> <button class="bt sm" data-a="pvPick" data-pid="'+pid+'">Elegir otro archivo</button>';
    else r=`<span class="muted">falta abrirlo</span> <button class="bt sm pri" data-a="pvAuth" data-pid="${pid}">Permitir acceso</button> <button class="bt sm" data-a="pvPick" data-pid="${pid}">Elegir archivo</button>`;
