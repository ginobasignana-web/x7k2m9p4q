async function tryAuth(pid){
  try{const rec=await DB.get('handles',pid);if(rec&&rec.h){if((await rec.h.requestPermission({mode:'read'}))==='granted'){FILES[pid]=await rec.h.getFile();await prepVideo(pid,FILES[pid]);return true}}}catch(e){}
  return false;
}
async function runPresExport(){
  if(EXP.busy)return;const msg=$('#pxMsg');const say=t=>{const m=$('#pxMsg');if(m)m.textContent=t};
  if(!pickMime()){say('Este navegador no puede grabar video. Usá Chrome actualizado.');return}
  const list=PRES.items.filter(i=>i.on).map(i=>({it:i,...resolveIt(i)})).filter(x=>x.a&&x.p&&x.p.src&&x.p.src.kind==='file');
  if(!list.length&&!PRES.items.some(x=>x.slide&&x.on)){say('No hay clips exportables: los partidos de YouTube necesitan su archivo (botón Cargar archivo) o usá la Simulación en pantalla.');return}
  let miss=[...new Set(list.map(x=>x.p.id))].filter(pid=>!(PV[pid]&&PV[pid].status==='ok'));
  for(const pid of miss){await tryAuth(pid)}
  miss=miss.filter(pid=>!(PV[pid]&&PV[pid].status==='ok'));
  if(miss.length){
    say('Falta abrir el video de «'+miss.map(pid=>(PRJ.find(p=>p.id===pid)||{}).name).join('», «')+'». Chrome pide permiso una vez por partido: tocá «Permitir acceso» o «Elegir archivo» en «Videos de los partidos» y volvé a exportar.');
    miss.forEach(pid=>{const r=document.querySelector('.vrow[data-vp="'+pid+'"]');if(r){r.classList.remove('need');void r.offsetWidth;r.classList.add('need')}});
    return;
  }
  OV_CTX='pres';const ov=Object.assign({},curOv());
  const items=presPlan(null,true);
  const c=PRES.cover;COVER_OVERRIDE=c;EXP.busy=true;EXP.abort=false;
  const r=await recordSequence({items,size:PRES.size,q:PRES.q,ov,cover:{on:c.on,dur:c.dur,title:c.title||PRES.name,sub:c.sub,line:c.line},ui:{pg:'#pxPg',msg:'#pxMsg',go:'#pxGo',goA:'peRun',goT:'Exportar MP4'}});
  COVER_OVERRIDE=null;EXP.busy=false;
  if(r.aborted){say('Exportación cancelada.');return}
  downloadBlob(r,'BVA_'+safe(PRES.name),'#pxMsg');
}
let dragP=null;
document.addEventListener('dragstart',ev=>{const tr=ev.target.closest&&ev.target.closest('tr.prow');if(!tr)return;dragP=+tr.dataset.pi;ev.dataTransfer.effectAllowed='move';try{ev.dataTransfer.setData('text/plain','p')}catch(e){}});
document.addEventListener('dragover',ev=>{const tr=ev.target.closest&&ev.target.closest('tr.prow');if(!tr||dragP==null)return;ev.preventDefault();document.querySelectorAll('tr.dropt').forEach(x=>x.classList.remove('dropt'));tr.classList.add('dropt')});
document.addEventListener('drop',ev=>{const tr=ev.target.closest&&ev.target.closest('tr.prow');if(!tr||dragP==null)return;ev.preventDefault();const from=dragP;dragP=null;pMove(from,+tr.dataset.pi)});
document.addEventListener('dragend',()=>{dragP=null});
document.addEventListener('toggle',ev=>{const d=ev.target;if(d&&d.classList&&d.classList.contains('pj')){d.open?POPEN.add(d.dataset.pid):POPEN.delete(d.dataset.pid)}},true);
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='presName'&&PRES){PRES.name=t.value;savePresSoon()}});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(PRES&&V.view==='pres'&&t.dataset&&t.dataset.sl!=null&&t.dataset.sl!==''){PRES.items[+t.dataset.sl].cover.dur=Math.max(1,Math.min(30,+t.value||3));savePresSoon();renderPresList();return}
  if(PRES&&V.view==='pres'&&t.dataset&&t.dataset.pc){PRES.cover[t.dataset.pc]=t.type==='checkbox'?t.checked:(Math.max(1,Math.min(30,+t.value||3.5)));savePresSoon();renderPresList();const x=$('#pxSum');if(x)x.textContent=pxSummary();return}
  if(!PRES||V.view!=='pres'||!t.dataset||!t.dataset.p)return;
  const k=t.dataset.p;PRES[k]=t.type==='checkbox'?t.checked:t.value;savePresSoon();
});
document.addEventListener('click',async ev=>{
  const t=ev.target.closest('[data-a]');if(!t)return;const a=t.dataset.a,id=t.dataset.id,i=+t.dataset.i,pid=t.dataset.pid;
  switch(a){
    case 'pickVideo':pickVideo();break;
    case 'fit':UI.mode='fit';UI.rwManual=false;UI.rw=440;saveUI();fitStage();break;
    case 'cine':toggleCine();break;
    case 'cinePad':document.body.classList.toggle('showpad');break;
    case 'finish':finishAnalysis();break;
    case 'libNew':newProject();setView('app');break;
    case 'home':{try{await saveProject()}catch(e){}showHome();break}

    case 'hmYt':await hmPrep();ytAsk();break;
    case 'hmLive':await hmPrep();ytAsk('live');break;

    case 'hmInfo':hmInfo(t.dataset.k);break;
    case 'hmLang':try{localStorage.setItem('bva_lang',t.dataset.l)}catch(e){}renderHome();break;
    case 'hmLic':hmLic();break;
    case 'hmMenu':hmMenu();break;
    case 'hmSave':{const o={};document.querySelectorAll('[data-ow]').forEach(i=>o[i.dataset.ow]=i.value.trim());try{localStorage.setItem('bva_owner',JSON.stringify(o))}catch(e){}closeModal();renderHome();break}
    case 'hmReset':{try{localStorage.removeItem('bva_owner')}catch(e){}closeModal();renderHome();break}
    case 'libOpen':{const p=(await DB.all('projects')).find(x=>x.id===id);if(p){loadProject(p);setView('app')}break}
    case 'libDel':if(confirm('¿Borrar este análisis? Las presentaciones que lo usen perderán esos clips.')){await DB.del('projects',id);await DB.del('handles',id);renderLib()}break;
    case 'presNew':{const n={id:uid(),name:'Nueva presentación',cover:covFix({}),size:'orig',q:'max',ov:{},titles:'game',showGame:true,items:[],saved:Date.now()};await DB.put('pres',n);openPres(n.id);break}
    case 'presOpen':openPres(id);break;
    case 'presDel':if(confirm('¿Borrar esta presentación? (los análisis no se tocan)')){await DB.del('pres',id);renderLib()}break;
    case 'presBack':savePres();setView('lib');break;
    case 'pcvEdit':COVER_OVERRIDE=PRES.cover;EXP.back=$('#pxGo')?showPresExport:null;showCover();break;
    case 'pcvUpload':{COVER_OVERRIDE=PRES.cover;EXP.back=$('#pxGo')?showPresExport:null;PRES.cover.mode='img';savePresSoon();showCover();const i=$('#coverIn');if(i)i.click();break}
    case 'pAddMont':{ev.preventDefault();const p=PRJ.find(x=>x.id===pid);addPres((p.mont||[]).filter(m=>m.on&&p.actions.some(a=>a.id===m.id)).map(m=>({pid,aid:m.id})));break}
    case 'pAddAll':{ev.preventDefault();const p=PRJ.find(x=>x.id===pid);addPres(p.actions.slice().sort((x,y)=>x.start-y.start).map(a=>({pid,aid:a.id})));break}
    case 'pAddCat':{const p=PRJ.find(x=>x.id===pid);addPres(p.actions.filter(q=>q.cat===t.dataset.c).sort((x,y)=>x.start-y.start).map(q=>({pid,aid:q.id})));break}
    case 'pAdd':addPres([{pid,aid:t.dataset.aid}]);break;
    case 'pSlideNew':pSlideNew(false);break;
    case 'pSlideImg':pSlideNew(true);break;
    case 'pSlideEdit':{COVER_OVERRIDE=PRES.items[i].cover;EXP.back=null;showCover();break}
    case 'pcvOn':{PRES.cover.on=t.checked;savePresSoon();renderPresHead();renderPresList();break}
    case 'pOn':{PRES.items[i].on=t.checked;savePresSoon();renderPresList();renderPresVids();prepSilent();break}
    case 'pUp':pMove(i,i-1);break;case 'pDn':pMove(i,i+1);break;
    case 'pRm':PRES.items.splice(i,1);savePresSoon();renderPresList();renderPresVids();break;
    case 'pClear':if(PRES.items.length&&confirm('¿Vaciar la presentación?')){PRES.items=[];savePresSoon();renderPresList();renderPresVids()}break;
    case 'pGroup':{const ord=[];PRES.items.forEach(x=>{if(!x.slide&&!ord.includes(x.pid))ord.push(x.pid)});if(PRES.items.some(x=>x.slide)){toast('Hay portadas sueltas: se mantienen al final');}PRES.items.sort((p,q)=>(p.slide?1e6:ord.indexOf(p.pid))-(q.slide?1e6:ord.indexOf(q.pid)));savePresSoon();renderPresList();break}
    case 'pvAuth':{if(!(await tryAuth(pid)))toast('No se pudo: elegí el archivo manualmente');break}
    case 'pvPick':{
      if(window.showOpenFilePicker){try{const [h]=await window.showOpenFilePicker({types:[{description:'Video',accept:{'video/*':['.mp4','.mov','.webm','.m4v','.mkv','.avi']}}]});const f=await h.getFile();await pvYt(pid,f);FILES[pid]=f;DB.put('handles',{id:pid,h}).catch(()=>{});prepVideo(pid,f)}catch(e){}}
      else{EXP.pickPid=pid;$('#pvIn').click()}
      break}
    case 'ytFile':{
      if(window.showOpenFilePicker){try{const [h]=await window.showOpenFilePicker({types:[{description:'Video',accept:{'video/*':['.mp4','.mov','.webm','.m4v','.mkv','.avi']}}]});ytUseFile(await h.getFile(),h)}catch(e){}}
      else{EXP.ytPick=true;$('#fileIn').click()}
      break}
    case 'ytHow':openModal(`<h3>Cómo conseguir el archivo del partido</h3>
      <p><b>Un video tuyo en YouTube:</b> entrá a <b>YouTube Studio → Contenido</b>, abrí el menú ⋮ del video y elegí <b>Descargar</b>.</p>
      <p><b>Una transmisión en vivo:</b> guardá la grabación desde la plataforma que usaste (o desde OBS si transmitís vos). Cuando termina el vivo, también podés descargarla desde YouTube Studio.</p>
      <p><b>Video de otra persona:</b> pedile el archivo al dueño. El Editor no baja videos de YouTube.</p>
      <p class="muted">Al cargarlo, las marcas ya hechas siguen en su lugar: se cortan los clips del archivo con los mismos tiempos.</p>
      <button class="bt" data-a="closeM">Entendido</button>`);break;
    case 'peGo':showPresExport();break;
    case 'peRun':runPresExport();break;

});

  'cx:title':'Título|Texto principal de la portada.','cx:sub':'Subtítulo|Texto secundario bajo el título.','cx:line':'Línea extra|Fecha, rival, torneo…',
  'cx:font':'Letra|Tipografía de la portada.','cx:tsize':'Tamaño del título','cx:ssize':'Tamaño del subtítulo','cx:bold':'Negrita',
  'cx:bg1':'Color de fondo','cx:bg2':'Segundo color|Crea un degradé entre los dos colores.','cx:ang':'Ángulo del degradé',
  'cx:fg':'Color del texto','cx:acc':'Línea de acento|Color de la línea bajo el título.',
  'cx:brand':'Marca|Escribe «BASINGAME» abajo, bien suave.',
  'cx:lk':'Logo|Elegí el logo de Basingame, la pelotita, o subí el tuyo.','cx:logoSize':'Tamaño del logo',
  'ov:lk':'Logo|Basingame (logo o pelotita), tu propio logo, o ninguno.','ov:lpos':'Ubicación del logo|En qué esquina del video aparece.','ov:lsize':'Tamaño del logo',
  'ov:label':'Etiqueta de la jugada|Muestra «#n CATEGORÍA · descriptores» sobre el video.','ov:lblPos':'Dónde va la etiqueta|Arriba o abajo del video.',
  'ov:game':'Nombre del partido|En presentaciones, muestra de qué partido es cada clip.','ov:gamePos':'Dónde va el nombre del partido|Arriba o abajo.',
  'ov:foot':'Pie de video|Un texto fijo (ej. «BASINGAME GBCOACH · Análisis vs Cuenca») en una banda.','ov:footPos':'Dónde va el pie|Arriba o abajo del video.','ov:footText':'Texto del pie|Se repite en todos los clips.',
  'fm:size':'Tamaño|«Igual al video» conserva la resolución original (mínimo 720p). Elegí otro para achicar el archivo.',
  'fm:q':'Calidad|Más calidad = archivo más pesado. «Máxima» no pierde nitidez visible.',
  'd:dur':'Visible|Cuántos segundos queda el dibujo en pantalla.','d:w':'Grosor del trazo',
  'x:titles':'Tarjetas de título|Intercala una tarjeta cuando cambia la categoría.',
  'p:titles':'Tarjetas de título|Intercala una tarjeta por partido o por categoría.'
};
const TIPI={
  seek:'Línea de tiempo|Arrastrá para moverte por el video.|← → ↑ ↓',
  rate:'Velocidad|Velocidad de reproducción.',vol:'Volumen',
  pName:'Nombre del partido|Aparece en Mis análisis y como título por defecto de la portada.',
  presName:'Nombre de la presentación|Es el nombre del archivo y el título por defecto de la portada.',
  impIn:'Importar proyecto|Abre un archivo JSON guardado con «Guardar proyecto».'
};
function btnTip(b){
  const key=b.key?b.key.toUpperCase():'';
  if(S.edit)return b.name+'|Tocá para editar este botón: nombre, color, tecla y comportamiento.';
  let d;
  if(b.type==='desc')d='Etiqueta: agrega «'+b.name+'» a la última jugada o a las seleccionadas.'+(b.excl?' Reemplaza a otras del grupo «'+b.excl+'».':'');
  else if(b.type==='manual')d='Primer click = inicio, segundo click = fin del clip.'+((b.pre||b.post)?' Margen: '+b.pre+' s antes y '+b.post+' s después.':'');
  else{const cu=b.cut||'around';d=cu==='after'?'Crea un clip desde el click y '+b.post+' s hacia adelante.':cu==='before'?'Crea un clip que termina en el click y empieza '+b.pre+' s antes.':'Crea un clip de '+b.pre+' s antes a '+b.post+' s después del momento actual.'}
  return b.name+'|'+d+(key?'|Atajo: '+key:'');
}
(function(){
  const tip=document.createElement('div');tip.id='tip';document.body.appendChild(tip);
  let tm=null,cur=null;
  const keys=['f','f2','af','mf','cx','ov','fm','x','p','d'];
  function tipFor(el){
    if(!el||el.nodeType!==1)return '';
    if(el.hasAttribute('title')){el.dataset.t0=el.getAttribute('title');el.removeAttribute('title')}
    const d=el.dataset||{};
    if(d.tip)return d.tip;
    if(d.a&&TIPS[d.a]!=null){const x=TIPS[d.a];return typeof x==='function'?x(el):x}
    for(const k of keys)if(d[k]&&TIPF[k+':'+d[k]])return TIPF[k+':'+d[k]];
    if(el.id&&TIPI[el.id])return TIPI[el.id];
    if(d.t0)return d.t0;
    return '';
  }
  function find(t){
    let el=t&&t.nodeType===1?t:t&&t.parentElement;
    for(let i=0;el&&i<6&&el!==document.body;i++,el=el.parentElement){
      const s=tipFor(el);if(s)return {el,s};
      if(el.tagName==='LABEL'){const inp=el.querySelector('input,select,textarea');if(inp){const s2=tipFor(inp);if(s2)return {el,s:s2}}}
    }
    return null;
  }
  function hide(){clearTimeout(tm);tip.classList.remove('on');cur=null}
  function show(el,s){
    const [t,d,k]=s.split('|');
    tip.innerHTML=(d?`<b>${esc(t)}</b><span>${esc(d)}</span>`:`<span>${esc(t)}</span>`)+(k?`<kbd>${esc(k)}</kbd>`:'');
    tip.style.left='0px';tip.style.top='0px';
    const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
    let x=r.left+r.width/2-tw/2,y=r.bottom+9;
    if(y+th>innerHeight-8)y=r.top-th-9;
    tip.style.left=clamp(x,8,innerWidth-tw-8)+'px';tip.style.top=Math.max(8,y)+'px';
    tip.classList.add('on');
  }
  document.addEventListener('mouseover',ev=>{
    const f=find(ev.target);
    if(!f){hide();return}
    if(cur===f.el)return;
    hide();cur=f.el;
    tm=setTimeout(()=>{if(cur===f.el&&document.body.contains(f.el))show(f.el,f.s)},320);
  });
  document.addEventListener('mouseout',ev=>{if(cur&&!(ev.relatedTarget&&cur.contains(ev.relatedTarget)))hide()});
  ['mousedown','keydown','wheel','dragstart'].forEach(e=>document.addEventListener(e,hide,true));
  window.addEventListener('blur',hide);
  document.addEventListener('scroll',hide,true);
  window.__tipFind=find;
})();

/* ====================== dibujo sobre el video (telestración) ====================== */
const DR={on:false,tool:'arrow',color:'#ffd400',w:.005,cur:null,shapes:[],noteId:null,t:0,dur:4};
const DCOLORS=['#ffd400','#ff4d4d','#3ddc84','#4d84ff','#ffffff','#111111'];
function notesArr(){return S.proj.notes||(S.proj.notes=[])}
function activeNotes(t,arr){return (arr||[]).filter(n=>t>=n.t-0.02&&t<n.t+n.dur)}
function vidRect(){
  const st=$('#stage'),W=st.clientWidth,H=st.clientHeight;
  let ar=16/9;if(Pl.kind==='file'&&Pl.v.videoWidth)ar=Pl.v.videoWidth/Pl.v.videoHeight;
  let w=W,h=W/ar;if(h>H){h=H;w=H*ar}
  return {x:(W-w)/2,y:(H-h)/2,w,h};
}
function drawShape(ctx,sh,X,Y,W,H){
  ctx.save();ctx.strokeStyle=sh.c;ctx.fillStyle=sh.c;ctx.lineWidth=Math.max(2,sh.w*W);ctx.lineCap='round';ctx.lineJoin='round';
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=ctx.lineWidth*.8;
  const px=p=>X+p[0]*W,py=p=>Y+p[1]*H;
  if(sh.k==='pen'){ctx.beginPath();sh.p.forEach((p,i)=>i?ctx.lineTo(px(p),py(p)):ctx.moveTo(px(p),py(p)));ctx.stroke()}
  else if(sh.k==='line'||sh.k==='arrow'){
    const [a,b]=sh.p;ctx.beginPath();ctx.moveTo(px(a),py(a));ctx.lineTo(px(b),py(b));ctx.stroke();
    if(sh.k==='arrow'){const ang=Math.atan2(py(b)-py(a),px(b)-px(a)),hl=Math.max(14,ctx.lineWidth*4.2);
      ctx.beginPath();ctx.moveTo(px(b),py(b));ctx.lineTo(px(b)-hl*Math.cos(ang-.45),py(b)-hl*Math.sin(ang-.45));ctx.lineTo(px(b)-hl*Math.cos(ang+.45),py(b)-hl*Math.sin(ang+.45));ctx.closePath();ctx.fill()}
  }else if(sh.k==='circle'){const [a,b]=sh.p;ctx.beginPath();ctx.ellipse((px(a)+px(b))/2,(py(a)+py(b))/2,Math.max(1,Math.abs(px(b)-px(a))/2),Math.max(1,Math.abs(py(b)-py(a))/2),0,0,7);ctx.stroke()}
  else if(sh.k==='text'){ctx.font='700 '+Math.round(H*.055)+'px '+OVF;ctx.textBaseline='middle';ctx.textAlign='left';ctx.lineWidth=Math.max(3,H*.009);ctx.strokeStyle='rgba(0,0,0,.75)';ctx.shadowBlur=0;ctx.strokeText(sh.t,px(sh.p[0]),py(sh.p[0]));ctx.fillText(sh.t,px(sh.p[0]),py(sh.p[0]))}
  ctx.restore();
}
function paintNotes(ctx,notes,t,X,Y,W,H){activeNotes(t,notes).forEach(n=>n.shapes.forEach(sh=>drawShape(ctx,sh,X,Y,W,H)))}
let dLast='';
function dTick(){
  const cv=$('#dcv');if(!cv)return;
  const r=vidRect(),dpr=Math.min(2,window.devicePixelRatio||1);
  const key=[r.x,r.y,r.w,r.h,dpr].map(Math.round).join();
  if(key!==dLast){dLast=key;cv.style.left=r.x+'px';cv.style.top=r.y+'px';cv.style.width=r.w+'px';cv.style.height=r.h+'px';cv.width=Math.max(2,Math.round(r.w*dpr));cv.height=Math.max(2,Math.round(r.h*dpr))}
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  if(DR.on){DR.shapes.forEach(sh=>drawShape(ctx,sh,0,0,cv.width,cv.height));if(DR.cur)drawShape(ctx,DR.cur,0,0,cv.width,cv.height)}
  else if(Pl.ready())paintNotes(ctx,(SIM.on&&SIM.notes)?SIM.notes:S.proj.notes,Pl.t(),0,0,cv.width,cv.height);
}
setInterval(dTick,50);
function dbHTML(){
  const T=[['pen','✎','Lápiz'],['arrow','➚','Flecha'],['line','／','Línea'],['circle','◯','Círculo'],['text','T','Texto']];
  return `<div class="dgrp">${T.map(([k,i,n])=>`<button class="dbt ${DR.tool===k?'on':''}" data-a="dtool" data-k="${k}">${i}</button>`).join('')}</div>
  <div class="dgrp">${DCOLORS.map(c=>`<button class="dcol ${DR.color===c?'on':''}" data-a="dcol" data-c="${c}" style="background:${c}"></button>`).join('')}</div>
  <div class="dgrp"><select data-d="w"><option value="0.003" ${DR.w==.003?'selected':''}>Fino</option><option value="0.005" ${DR.w==.005?'selected':''}>Medio</option><option value="0.009" ${DR.w==.009?'selected':''}>Grueso</option></select>
  <label class="dvis">Visible <input type="number" min="1" max="30" step="1" data-d="dur" value="${DR.dur}"> s</label></div>
  <div class="dgrp"><button class="bt sm" data-a="dundo">↶</button><button class="bt sm" data-a="dclear">Limpiar</button><button class="bt sm dng" data-a="ddel">Borrar dibujo</button><button class="bt sm pri" data-a="ddone">Listo</button><button class="bt sm" data-a="dcancel">✕</button></div>`;
}
function startDraw(){
  if(!Pl.ready()){toast('Cargá un video primero');return}
  if(DR.on)return;
  Pl.pause();if(S.clip)stopClip();
  DR.t=Pl.t();const ex=activeNotes(DR.t,S.proj.notes)[0];
  if(ex){DR.noteId=ex.id;DR.shapes=JSON.parse(JSON.stringify(ex.shapes));DR.dur=ex.dur;DR.t=ex.t}
  else{DR.noteId=null;DR.shapes=[];DR.dur=4}
  DR.cur=null;DR.on=true;document.body.classList.add('drawing');
  $('#dtb').innerHTML=dbHTML();toast(ex?'Editando el dibujo de este momento':'Dibujá sobre el video');
}
function endDraw(save){
  if(!DR.on)return;
  if(save){
    const arr=notesArr(),i=arr.findIndex(n=>n.id===DR.noteId);
    if(DR.shapes.length){const n={id:DR.noteId||uid(),t:R2(DR.t),dur:DR.dur,shapes:DR.shapes};if(i>=0)arr[i]=n;else arr.push(n)}
    else if(i>=0)arr.splice(i,1);
    markDirty();renderTL();
  }
  DR.on=false;DR.cur=null;document.body.classList.remove('drawing');
}
(function(){
  let down=false;
  const pt=ev=>{const r=$('#dcv').getBoundingClientRect();return [clamp((ev.clientX-r.left)/r.width,0,1),clamp((ev.clientY-r.top)/r.height,0,1)]};
  document.addEventListener('pointerdown',ev=>{
    if(!DR.on||ev.target.id!=='dcv')return;ev.preventDefault();
    const p=pt(ev);
    if(DR.tool==='text'){const t=prompt('Texto:');if(t)DR.shapes.push({k:'text',c:DR.color,w:DR.w,p:[p],t});return}
    down=true;DR.cur={k:DR.tool,c:DR.color,w:DR.w,p:DR.tool==='pen'?[p]:[p,p]};
    try{ev.target.setPointerCapture(ev.pointerId)}catch(e){}
  });
  document.addEventListener('pointermove',ev=>{
    if(!down||!DR.cur)return;const p=pt(ev);
    if(DR.cur.k==='pen')DR.cur.p.push(p);else DR.cur.p[1]=p;
  });
  document.addEventListener('pointerup',()=>{
    if(!down)return;down=false;
    if(DR.cur){const c=DR.cur;const big=c.k==='pen'?c.p.length>2:(Math.abs(c.p[1][0]-c.p[0][0])+Math.abs(c.p[1][1]-c.p[0][1])>.01);if(big)DR.shapes.push(c)}
    DR.cur=null;
  });
  document.addEventListener('click',ev=>{
    const t=ev.target.closest('[data-a]');if(!t)return;
    switch(t.dataset.a){
      case 'draw':DR.on?endDraw(true):startDraw();break;
      case 'dtool':DR.tool=t.dataset.k;$('#dtb').innerHTML=dbHTML();break;
      case 'dcol':DR.color=t.dataset.c;$('#dtb').innerHTML=dbHTML();break;
      case 'dundo':DR.shapes.pop();break;
      case 'dclear':DR.shapes=[];break;
      case 'ddel':DR.shapes=[];endDraw(true);toast('Dibujo borrado');break;
      case 'ddone':endDraw(true);break;
      case 'dcancel':endDraw(false);break;
      case 'note':{const n=notesArr().find(q=>q.id===t.dataset.id);if(n)Pl.seek(n.t);break}
    }
  });
  document.addEventListener('input',ev=>{
    const t=ev.target;if(!t.dataset||!t.dataset.d)return;
    if(t.dataset.d==='w')DR.w=parseFloat(t.value);
    if(t.dataset.d==='dur')DR.dur=clamp(parseFloat(t.value)||4,1,30);
  });
})();

/* arranque */
(async()=>{
  try{await DB.open()}catch(e){console.warn('IndexedDB no disponible',e)}
  const direct=/[?&]app\b/.test(location.search);
  if(direct){try{const ps=await DB.all('projects');if(ps.length){ps.sort((a,b)=>b.saved-a.saved);if(!window.__bvaFresh){const p=ps[0];if(p.actions.length||p.name)loadProject(p)}}}catch(e){}}
  applyUI();renderAll();setTimeout(fitStage,60);
  if(!direct)showHome();
})();
