<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>BASINGAME · puente YouTube</title>
<meta name="robots" content="noindex">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{width:100%;height:100%}</style></head>
<body><div id="p"></div>
<script>
/* Puente para que BASINGAME EDITOR pueda reproducir YouTube aunque se abra como archivo.
   Solo reproduce el video que se le pide y obedece play / pausa / seek. No guarda ni envía nada. */
var q=new URLSearchParams(location.search),vid=q.get('v'),P=null,ready=false,ctl=q.get('c')!=='0',st0=+q.get('s')||0;
function post(m){m.bva=1;parent.postMessage(m,'*')}
window.onYouTubeIframeAPIReady=function(){
  P=new YT.Player('p',{videoId:vid,width:'100%',height:'100%',
    playerVars:{rel:0,modestbranding:1,playsinline:1,origin:location.origin,controls:ctl?1:0,disablekb:ctl?0:1,fs:ctl?1:0,iv_load_policy:ctl?1:3,autoplay:ctl?0:1,start:st0},
    events:{onReady:function(){ready=true;post({e:'ready'})},onError:function(e){post({e:'error',code:e.data})}}});
};
var s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);
setInterval(function(){
  if(!ready)return;var live=false;
  try{live=!!P.getVideoData().isLive}catch(e){}
  post({e:'state',t:P.getCurrentTime(),d:P.getDuration(),s:P.getPlayerState(),live:live,r:P.getPlaybackRate()});
},150);
addEventListener('message',function(ev){
  var m=ev.data;if(ev.source!==parent||!m||!m.bva||!ready)return;
  switch(m.c){
    case 'play':P.playVideo();break;
    case 'pause':P.pauseVideo();break;
    case 'seek':P.seekTo(m.t,true);break;
    case 'rate':P.setPlaybackRate(m.r);break;
    case 'vol':P.setVolume(m.v);break;
    case 'mute':P.mute();break;
    case 'unmute':P.unMute();break;
    case 'load':P.loadVideoById(m.s?{videoId:m.id,startSeconds:m.s}:m.id);break;
  }
});
</script></body></html>
